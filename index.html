<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>칼셀바도르: 푸른 재</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* ===== 테마: 푸른 재(v019) — 재빛 종이 / 밤의 쇳빛, 강조는 식은 재의 푸른빛, 따뜻한 빛은 가스등만 ===== */
:root{--k0:#20252e;--k1:#343b47;--k2:#4a5260;--k3:#636c7b;--k4:#7f8796;--k5:#9ca3b0;--k6:#bcc2cb;--k7:#dde1e6;--bg:#c3c8cf;--c:#dfe2e6;--c2:#d0d5db;--t:#1d222a;--m:#535b67;--a:#3d5476;--al:rgba(61,84,118,.45);--b:rgba(30,40,60,.20);--bad:#8e3b2b;--g:rgba(50,70,100,.08);--kw:#a8661f;--gauge:rgba(30,40,60,.14);
--bo:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><polygon points='5.21,0.50 26.79,0.50 31.50,5.21 31.50,26.79 26.79,31.50 5.21,31.50 0.50,26.79 0.50,5.21' fill='none' stroke='%233d5476' stroke-opacity='.7'/></svg>");
--bf:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><polygon points='5.21,0.50 26.79,0.50 31.50,5.21 31.50,26.79 26.79,31.50 5.21,31.50 0.50,26.79 0.50,5.21' fill='%23a3aec0' stroke='%233d5476'/></svg>");
--pn:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><polygon points='8.21,0.50 23.79,0.50 31.50,8.21 31.50,23.79 23.79,31.50 8.21,31.50 0.50,23.79 0.50,8.21' fill='%23dfe2e6' stroke='%233d5476' stroke-opacity='.5'/><polygon points='9.86,4.50 22.14,4.50 27.50,9.86 27.50,22.14 22.14,27.50 9.86,27.50 4.50,22.14 4.50,9.86' fill='none' stroke='rgba(30,40,60,.13)'/></svg>");
color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--k0:#08090c;--k1:#11141a;--k2:#1b1f27;--k3:#262b35;--k4:#313744;--k5:#3e4555;--k6:#566073;--k7:#7a8599;--bg:#14171c;--c:#1c2027;--c2:#252a33;--t:#dce1e8;--m:#959eac;--a:#9fb2ce;--al:rgba(159,178,206,.45);--b:rgba(170,185,210,.16);--bad:#c0614a;--g:rgba(159,178,206,.07);--kw:#e0a458;--gauge:rgba(0,0,0,.35);
--bo:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><polygon points='5.21,0.50 26.79,0.50 31.50,5.21 31.50,26.79 26.79,31.50 5.21,31.50 0.50,26.79 0.50,5.21' fill='none' stroke='%239fb2ce' stroke-opacity='.7'/></svg>");
--bf:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><polygon points='5.21,0.50 26.79,0.50 31.50,5.21 31.50,26.79 26.79,31.50 5.21,31.50 0.50,26.79 0.50,5.21' fill='%233a4251' stroke='%239fb2ce'/></svg>");
--pn:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><polygon points='8.21,0.50 23.79,0.50 31.50,8.21 31.50,23.79 23.79,31.50 8.21,31.50 0.50,23.79 0.50,8.21' fill='%231c2027' stroke='%239fb2ce' stroke-opacity='.5'/><polygon points='9.86,4.50 22.14,4.50 27.50,9.86 27.50,22.14 22.14,27.50 9.86,27.50 4.50,22.14 4.50,9.86' fill='none' stroke='rgba(170,185,210,.10)'/></svg>");
color-scheme:dark}}
:root[data-theme=dark]{--k0:#08090c;--k1:#11141a;--k2:#1b1f27;--k3:#262b35;--k4:#313744;--k5:#3e4555;--k6:#566073;--k7:#7a8599;--bg:#14171c;--c:#1c2027;--c2:#252a33;--t:#dce1e8;--m:#959eac;--a:#9fb2ce;--al:rgba(159,178,206,.45);--b:rgba(170,185,210,.16);--bad:#c0614a;--g:rgba(159,178,206,.07);--kw:#e0a458;--gauge:rgba(0,0,0,.35);
--bo:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><polygon points='5.21,0.50 26.79,0.50 31.50,5.21 31.50,26.79 26.79,31.50 5.21,31.50 0.50,26.79 0.50,5.21' fill='none' stroke='%239fb2ce' stroke-opacity='.7'/></svg>");
--bf:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><polygon points='5.21,0.50 26.79,0.50 31.50,5.21 31.50,26.79 26.79,31.50 5.21,31.50 0.50,26.79 0.50,5.21' fill='%233a4251' stroke='%239fb2ce'/></svg>");
--pn:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><polygon points='8.21,0.50 23.79,0.50 31.50,8.21 31.50,23.79 23.79,31.50 8.21,31.50 0.50,23.79 0.50,8.21' fill='%231c2027' stroke='%239fb2ce' stroke-opacity='.5'/><polygon points='9.86,4.50 22.14,4.50 27.50,9.86 27.50,22.14 22.14,27.50 9.86,27.50 4.50,22.14 4.50,9.86' fill='none' stroke='rgba(170,185,210,.10)'/></svg>");
color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t);font:15px/1.6 "Gowun Batang","Noto Serif KR",serif;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:break-word}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2,h3,.brand,.fn{font-family:"Nanum Myeongjo","Noto Serif KR",serif;font-weight:800}
h1{font-size:26px;margin:0;color:var(--a);letter-spacing:.08em;text-align:center}
.sub1{text-align:center;font:800 15px "Nanum Myeongjo",serif;letter-spacing:.4em;color:var(--m);margin:2px 0 8px}
h2{font-size:17px;margin:0 0 8px;color:var(--a)}
h3{font-size:14px;margin:12px 0 6px;color:var(--m);letter-spacing:.05em}
p{margin:6px 0}
.m{color:var(--m);font-size:13px}
b.g{color:var(--a)}
.btn{font:inherit;color:var(--t);background:none;border:8px solid transparent;border-image:var(--bo) 6 / 8px stretch;padding:3px 10px;cursor:pointer;min-height:42px;touch-action:manipulation;user-select:none;-webkit-user-select:none;text-align:center}
.btn:hover:not(:disabled),.btn:focus-visible{border-image:var(--bf) 6 fill / 8px stretch;outline:none}
.btn.pri,.btn.on{border-image:var(--bf) 6 fill / 8px stretch}
.btn:disabled{opacity:.38;cursor:default}
.btn.sm{min-height:34px;padding:0 6px;font-size:13px}
.btn small{display:block;font-size:11px;color:var(--m);line-height:1.25}
.card{position:relative;border:14px solid transparent;border-image:var(--pn) 12 fill / 14px stretch;padding:8px 10px;margin-bottom:12px}
.seg{display:flex;flex-wrap:wrap}
.seg .btn{flex:1 1 0;min-height:38px;font-size:13px;padding:0 4px}
.bar{position:relative;height:8px;background:var(--gauge);border:1px solid var(--b);margin:3px 0 6px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--a);transition:width .3s}
.bar.hp i{background:var(--bad)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.row span:last-child{color:var(--a)}
details>summary{cursor:pointer;list-style:none;color:var(--m);font-size:13px}
details>summary::-webkit-details-marker{display:none}
details>summary:before{content:"◇ ";color:var(--a)}
details[open]>summary:before{content:"◆ "}
textarea,input[type=text]{font:inherit;color:var(--t);background:var(--g);border:1px solid var(--b);padding:6px 8px;width:100%}
textarea{min-height:68px;font-size:12px}
kbd{font:12px/1 "Gowun Batang",serif;border:1px solid var(--al);padding:2px 5px;color:var(--t)}

/* ===== 배치 ===== */
#app{max-width:1180px;margin:0 auto;padding:10px 14px 30px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.brand{color:var(--a);font-size:17px;letter-spacing:.06em}
.brand b{font-size:13px;color:var(--m);font-family:"Gowun Batang",serif}
.tabs{display:flex;gap:2px;flex:1;justify-content:center}
.top>.btn{margin-left:auto}
.tab{font:inherit;background:none;border:0;color:var(--m);padding:6px 12px;cursor:pointer;position:relative;font-size:15px}
.tab.on{color:var(--t)}
.hbn{font-style:normal;color:var(--kw);font-size:11px}
.tab.on:after{content:"";position:absolute;left:50%;bottom:0;width:7px;height:7px;background:var(--a);transform:translateX(-50%) rotate(45deg)}
.grid{display:grid;grid-template-columns:290px 1fr 270px;gap:14px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}.grid .L{order:1}.grid .M{order:0}.grid .Rr{order:2}.tabs{order:3;flex-basis:100%}}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;margin:6px 0}
.acts .btn{text-align:left}
.prog{margin:8px 0}
.prog .bar{height:10px}
.log{font-size:12.5px;color:var(--m);max-height:260px;overflow:auto}
.log div{padding:2px 0;border-bottom:1px solid var(--b)}
.log div:first-child{color:var(--t)}
.place-d{color:var(--m);font-size:14px}
.lock{opacity:.6}
.bag{display:flex;flex-wrap:wrap;gap:6px}
.bag span{border:1px solid var(--b);padding:2px 8px;font-size:13px}
.empty{color:var(--m);font-size:13px;text-align:center;padding:10px 0}
.disp{border-top:1px solid var(--b);padding:6px 0;font-size:13px}
.ms{padding:6px 0;border-bottom:1px solid var(--b)}
.csk{margin:6px 0 0 10px}
.scw{position:relative;margin:-2px 0 10px;border:1px solid var(--b);overflow:hidden;aspect-ratio:3/1;background:var(--k6)}
.scs{display:block;width:100%;height:100%}
.k0{fill:var(--k0)}.k1{fill:var(--k1)}.k2{fill:var(--k2)}.k3{fill:var(--k3)}.k4{fill:var(--k4)}.k5{fill:var(--k5)}.k6{fill:var(--k6)}.k7{fill:var(--k7)}.kw{fill:var(--kw)}.sft{opacity:.55}.lit{opacity:.9}
.scs .moon{fill:var(--k7)}.scs .moonh{fill:var(--k7);opacity:.25}
.av{display:inline-flex;width:34px;height:34px;flex:none;border:1px solid var(--b);border-radius:2px;background:var(--c2);align-items:center;justify-content:center;overflow:hidden;vertical-align:middle}
.av svg{width:24px;height:24px}img.av{object-fit:cover;padding:0}
.avs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.avs .btn{padding:2px}.avs .btn.on .av{border-color:var(--a);box-shadow:0 0 0 1px var(--a)}
.nmrow{display:flex;align-items:center;gap:10px}.nmrow input{flex:1}.csk.off b{opacity:.55}
.ms.done{color:var(--m)}
.ms.now b{color:var(--a)}

/* ===== 지도 ===== */
.mapw{position:relative;height:420px;overflow:hidden;touch-action:none;cursor:grab;border:1px solid var(--b);background:radial-gradient(circle at 50% 40%,var(--g),transparent 75%);margin-top:4px;user-select:none;-webkit-user-select:none}@media(max-width:600px){.mapw{height:340px}}
.mapw.drag{cursor:grabbing}
.mapc{position:absolute;top:6px;right:6px;display:flex;gap:4px;z-index:2}
.mapc .btn{min-height:32px;min-width:34px;padding:0 6px;font-size:14px;background:var(--c)}
.map{position:absolute;left:0;top:0;transform-origin:0 0;display:block;overflow:visible}
.map .canal{fill:none;stroke:var(--b);stroke-width:26;opacity:.7;stroke-linecap:round}
.map .road{stroke:var(--bs,var(--a));stroke-width:1.5;stroke-dasharray:6 6;opacity:.55}
.map .road.lk{opacity:.2}
.map .route{stroke:var(--kw);stroke-width:3;stroke-dasharray:8 6;animation:rt 1.2s linear infinite}
@keyframes rt{to{stroke-dashoffset:-14}}
.map .node{cursor:pointer}
.map .node rect{fill:var(--c);stroke:var(--a);stroke-width:2}
.map .node:hover rect,.map .node:focus rect{fill:var(--c2);stroke-width:3}
.map .node.here rect{fill:var(--a)}
.map .node.dest rect{stroke:var(--kw);stroke-width:3.5}
.map .node.goal rect{stroke:var(--a);stroke-width:3;animation:gpulse 1.6s ease-in-out infinite}@keyframes gpulse{50%{stroke-width:7;stroke-opacity:.35}}
.goalc{border:1px solid var(--a);border-radius:10px;padding:10px 14px;margin:0 0 12px;background:color-mix(in srgb,var(--a) 7%,transparent)}.goalc .m{margin-top:4px}
.btn.goal{color:var(--a);font-weight:600}.btn.goal::before{content:'◆ ';font-size:.75em;vertical-align:.1em}.btn.goal small{font-weight:400}
.map .node.lk{opacity:.4}
.map .node text{font:700 15px "Gowun Batang",serif;fill:var(--t);text-anchor:middle}.map .node text.hr{font-size:12px;font-weight:400;fill:var(--a)}
.map .node.here text{font-weight:700;fill:var(--a)}
.map .mk{fill:var(--kw);stroke:var(--c);stroke-width:2}

/* ===== 만들기 화면 ===== */
.cr{max-width:720px;margin:0 auto}
.lead{text-align:center;max-width:560px;margin:4px auto;text-wrap:balance}
.cr .lead:not(.m){color:var(--t)}
.cr .card{margin-bottom:10px}
.tr-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}
.tr-list .btn{font-size:13px;min-height:36px}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;font-size:14px}
.stats .bar{margin:0}
.stats.st4{grid-template-columns:auto 1fr auto}
.stats.st4 .sne{grid-column:1/-1;margin:-2px 0 6px}
.stats .btn.sm{min-height:26px;padding:0 4px;margin-left:4px}

/* ===== 창 ===== */
.ovl{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;background:rgba(8,10,14,.74);overflow:auto;padding:24px 14px}
.ovl.on{display:flex}
#ov{z-index:40}#sov{z-index:60}#bt{z-index:30;background:var(--bg);display:none;padding:0}
#bt.on{display:block}
.pcard{position:relative;margin:auto;max-width:460px;width:100%;border:14px solid transparent;border-image:var(--pn) 12 fill / 14px stretch;padding:12px 16px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
.pcard.w{max-width:620px}
.pcard:before,.pcard:after{content:"";position:absolute;left:50%;width:9px;height:9px;background:var(--a);transform:translateX(-50%) rotate(45deg)}
.pcard:before{top:-19px}.pcard:after{bottom:-19px}
.pcard h2{text-align:center}
.btns{display:grid;gap:6px;margin-top:12px}
.btns.two{grid-template-columns:1fr 1fr}
.items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.items span{border:1px solid var(--al);padding:2px 8px;font-size:13px}
.set{display:grid;gap:12px;margin-top:6px}
.set label{display:block;font-size:13px;color:var(--m);margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--a)}

/* ===== 개발자 창 ===== */
#devb{position:fixed;left:10px;bottom:10px;z-index:75;opacity:.75}
#dov{z-index:95}
.dev h3{margin:10px 0 4px}
.dev .seg .btn{min-height:34px;font-size:12.5px}
#bdev{display:none;gap:4px}#bdev.on{display:inline-flex}

/* ===== 시작 연출 (1편 엔딩 슬라이드 방식) ===== */
#pv{display:none}#pv.on{display:block}
.eo{position:fixed;inset:0;z-index:80;background:#07090c;color:#d3dae4;display:flex;align-items:center;justify-content:center;padding:30px 24px;cursor:pointer}
.ei{max-width:600px;text-align:center}
.el,.eh{text-wrap:balance}
.eh{font:800 15px "Nanum Myeongjo",serif;letter-spacing:.3em;color:#8597b4;margin-bottom:26px;opacity:0;animation:efi 1s forwards}
.el{font-size:17px;line-height:2;margin:10px 0;opacity:0;animation:efi 1.1s forwards}
.el .m{color:#7f8a9b;font-size:14px}
.ek{font:800 30px "Nanum Myeongjo",serif;letter-spacing:.25em;color:#b9c8de;margin:4px 0}
.esub{font-size:17px;letter-spacing:.5em;color:#8597b4}
.eo.now .el,.eo.now .eh,.eo.now .eb{animation-delay:0s!important;animation-duration:.25s}
.eb{opacity:0;animation:efi 1s forwards;margin-top:30px;color:#d3dae4;border-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><polygon points='5.21,0.50 26.79,0.50 31.50,5.21 31.50,26.79 26.79,31.50 5.21,31.50 0.50,26.79 0.50,5.21' fill='none' stroke='%238597b4' stroke-opacity='.8'/></svg>") 6 / 8px stretch}
.eb:hover,.eb:focus-visible{border-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><polygon points='5.21,0.50 26.79,0.50 31.50,5.21 31.50,26.79 26.79,31.50 5.21,31.50 0.50,26.79 0.50,5.21' fill='%23272d37' stroke='%238597b4'/></svg>") 6 fill / 8px stretch}
.es{position:fixed;bottom:22px;left:0;right:0;text-align:center;font-size:12px;color:#5f6878}
.es span{text-decoration:underline;cursor:pointer}
.epn{position:fixed;top:18px;right:22px;font-size:12px;color:#4e5664}
@keyframes efi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== 전투 ===== */
.bwrap{max-width:560px;margin:0 auto;padding:14px 16px 28px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
.btop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btop .brand{font-size:14px;color:var(--m)}
.fn{display:flex;justify-content:center;align-items:baseline;gap:8px;font-size:19px;letter-spacing:.06em}
.fph{font-size:12px;color:var(--bad);font-family:"Gowun Batang",serif;font-weight:700}
.bbar{position:relative;height:8px;background:var(--gauge);border:1px solid var(--b);margin-top:5px}
.bbar i{position:absolute;left:0;top:0;bottom:0;background:var(--bad);transition:width .25s}
.bbar b{position:absolute;left:0;top:0;bottom:0;background:var(--kw);opacity:.55;transition:width .9s .35s}
.bbar.me i{background:var(--a)}
#btele{text-align:center;min-height:46px;color:var(--m);font-size:14px}
#btele .mv{color:var(--t);font-weight:700}
#btele .dm{letter-spacing:5px;color:var(--a);font-size:12px}
#btele .coach{color:var(--a);font-size:13px;margin-bottom:2px}#btele .coach b{color:var(--t)}
#barena{position:relative;width:min(84vw,320px,max(170px,calc(100vh - 540px)));width:min(84vw,320px,max(170px,calc(100dvh - 540px)));aspect-ratio:1;margin:0 auto 44px;touch-action:none}
#barena canvas{width:100%;height:100%;display:block}
#bjudge{position:absolute;left:-40px;right:-40px;top:calc(100% - 4px);text-align:center;font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:20px;letter-spacing:.08em;pointer-events:none;opacity:0}
#bjudge.on{animation:jd .7s ease-out forwards}
@keyframes jd{0%{opacity:0;transform:translateY(6px) scale(.9)}15%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
#bjudge.parry{color:var(--kw)}#bjudge.hit{color:var(--bad)}#bjudge.dodge{color:var(--t)}#bjudge.miss{color:var(--m)}
.shake{animation:sk .32s}
@keyframes sk{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
#bqte{text-align:center}
.track{position:relative;height:14px;background:var(--gauge);border:1px solid var(--b);margin:4px 8px}
#bqz{position:absolute;top:-1px;bottom:-1px;background:var(--al);border-left:1px solid var(--kw);border-right:1px solid var(--kw)}
#bqm{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1px;background:var(--t)}
.qh{font-size:12px;color:var(--m);margin-top:4px}
#bme .row{font-size:13px;color:var(--m)}
#bme .row b{color:var(--t);font-weight:400}

 ibre2:c=>{jr('부두 창고 뒤 내기 결투장에서 무색 비늘의 거인과 겨뤘다. 결투장에서는 그녀를 무색 셋이라고 불렀다. 스스로 지은 이름은 이브레였다.');
   ev('이브레',(c?'<p>거인이 눈을 크게 뜬다. 한참 말이 없다.</p><p>무색 셋 — “…이브레입니다. 제가 지었습니다. 그 이름을 물은 사람은 처음입니다.”</p>':'<p>무색 셋 — “명부에 없는 사람은 일을 못 구합니다. 여기는 명부를 묻지 않습니다.”</p><p>무색 셋 — “이브레입니다. 번호 말고 이름은 그겁니다.”</p>')+
   '<p>이브레 — “결투장의 규칙으로는 이긴 사람이 진 사람의 주인입니다. 저는 그 규칙이 싫습니다. 그래서 묻겠습니다.”</p><p>이브레 — “같이 가도 되겠습니까? 주인이 아니라 일행으로.”</p>',
   [[joinL('ibre'),()=>{joinComp('ibre');aff('ibre',c?6:2);SCENE.joined('ibre','…감사합니다. 문틀만 조심하겠습니다.')}],['혼자 다니겠다',()=>{S.dec.ibre=1;log('이브레와 함께 가지 않기로 했다.');ev('이브레','<p>이브레 — “알겠습니다. 저는 계속 여기서 싸웁니다. 마음이 바뀌면 오십시오.”</p><p class="m">이브레는 부두 창고 뒤 결투장에 있다.</p>',[['돌아선다',null]],1);save()}]])},
 ibreAgain:()=>ev('창고 뒤의 이브레','<p>결투장 구석에 이브레가 앉아 있다. 오늘은 싸우지 않았는지 비늘이 깨끗하다.</p><p>이브레 — “오셨습니까. 마음이 바뀌었습니까?”</p>',
   [[joinL('ibre'),()=>{delete S.dec.ibre;joinComp('ibre');SCENE.joined('ibre','기다렸습니다. 조금.')}],['아직이다',null]]),
 kasM:()=>ev('납골당의 남자',`<p>오르빌 가문 무덤 옆 벨데인 가문 납골당 앞. 검은 외투의 젊은 귀족이 계단에 앉아 붉은 병을 기울이고 있다. 지팡이 손잡이가 은빛이다.</p><p>귀족 — “오르빌 영감 무덤을 찾아오는 사람이 다 있군요. 그 영감은 노래를 참 못했죠.”</p><p class="m">오르빌이 죽은 지 사십 년이 넘었다. 이 사람은 서른도 안 되어 보인다.</p><p>귀족이 고개를 들어 내 얼굴을 본다. 웃음이 잠깐 멎는다.</p><p>귀족 — “…어디서 뵌 것 같군요. 아니, 그럴 리가 없죠.”</p>`,
   [['누구냐고 묻는다',()=>SCENE.kas2(1)],['오르빌을 어떻게 아느냐고 묻는다',()=>SCENE.kas2(0)]]),
 kas2:c=>{jr('교단 묘지 벨데인 가문 납골당 앞에서 젊은 귀족 카시미르를 만났다. 사십 년 전에 죽은 오르빌을 직접 아는 것처럼 말했다. 내 얼굴을 보고 어디서 본 것 같다고 했다.');
   ev('카시미르',(c?'<p>귀족 — “카시미르. 벨데인 가문의 마지막 상속자죠. 지금은 남 대신 칼을 맞아 주고 돈을 법니다.”</p>':'<p>귀족 — “아버지께 들었죠. 아니, 할아버지였던가. 오래된 이야기라 헷갈리네요.”</p><p>귀족 — “카시미르입니다. 벨데인 가문의 마지막 상속자.”</p>')+
   '<p>카시미르 — “그 저택에 가시려는 거죠? 노래하는 유령이 있다던데. 재미있겠네요. 마침 따분하던 참이죠.”</p><p>카시미르 — “제 칼을 빌려드리죠. 값은 나중에 받겠습니다. 재미로.”</p>'+pline({oswin:'벨데인 가문이라. 제 기억으로는 육십 년 전에 대가 끊겼는데요.',kirien:'저 병. 피 냄새 나.',ibre:'이 사람 비늘이 없는데 늙지도 않았습니다. 이상합니다.'}),
   [[joinL('kasimir'),()=>{joinComp('kasimir');aff('kasimir',2);SCENE.joined('kasimir','좋습니다. 우아하게 따라가 드리죠.')}],['혼자 가겠다',()=>{S.dec.kasimir=1;log('카시미르와 함께 가지 않기로 했다.');ev('카시미르','<p>카시미르 — “아쉽네요. 저는 여기 자주 옵니다. 마음이 바뀌면 오시죠.”</p><p class="m">카시미르는 교단 묘지 납골당 앞에 있다.</p>',[['돌아선다',null]],1);save()}]])},
 kasAgain:()=>ev('납골당의 카시미르','<p>카시미르가 납골당 계단에서 붉은 병을 흔들어 보인다.</p><p>카시미르 — “돌아오실 줄 알았죠. 지루한 사람은 저를 그냥 지나치지 못하거든요.”</p>',
   [[joinL('kasimir'),()=>{delete S.dec.kasimir;joinComp('kasimir');SCENE.joined('kasimir','기다리게 하셨으니 이자는 나중에 받죠.')}],['아직이다',null]]),
 /* ===== 바르그·에노 만남 (v019) ===== */
 bargM:()=>ev('녹슨 닻 여관 부엌',`<p>여관 주인이 부엌 쪽으로 턱짓한다.</p><p>여관 주인 — “일주일째 저기서 국을 끓여 주는 사내가 있어. 방값 대신. 그런데 오늘 아침 헌병 둘이 그 사내를 찾더군.”</p>
   <p>부엌. 늑대 머리의 거구가 솥을 젓고 있다. 앞치마가 손수건처럼 작아 보인다. 이쪽을 보고 국자를 멈춘다.</p><p>사내 — “…먹어.”</p><p class="m">대답할 틈도 없이 그릇이 내 앞에 놓인다. 맛있다.</p>
   <p>문이 거칠게 열린다. 회색 바탕에 붉은 띠를 두른 헌병 둘이다.</p><p>헌병 — “탈영병 바르그. 해빙 전쟁 북부 3연대. 같이 가 줘야겠다.”</p><p class="m">사내는 국자를 쥔 채 움직이지 않는다. 도망칠 생각도 싸울 생각도 없는 얼굴이다.</p>`+
   pline({kirien:'저 사람 안 싸워. 끌려가면 그냥 끌려갈 얼굴이야.',oswin:'탈영병이라. 헌병 장부에 이름이 있는 사람은 그래도 운이 좋은 편이지요.',ibre:'저 사람은 국을 끓였습니다. 맛있었습니다.',kasimir:'점심이 식겠군요. 그건 용서가 안 되죠.',eno:'저 사람 안에서 이름들이 웅웅거려요. 아주 많이.'}),
   [['막아선다',()=>{S.bstory='barg';save();startBattle('fight','mp')}],['우리 저택 요리사라고 둘러댄다',()=>SCENE.bargLie()]]),
 bargLie:()=>{S.bargL=1;ev('녹슨 닻 여관 부엌','<p>헌병이 나를 아래위로 훑는다.</p><p>헌병 — “오르빌 저택? 유령 나오는 그 집 말이지.”</p><p class="m">사내가 눈을 크게 뜬다. 그리고 아무 말 없이 앞치마를 고쳐 맨다. 요리사처럼.</p><p>헌병 — “요리사라. 다음에 확인하러 가겠다.”</p><p class="m">헌병들이 물러간다. 문간에서 한 번 더 돌아본다.</p>',[['부엌 뒷문으로 나선다',()=>SCENE.bargW()]],1)},
 bargW:()=>ev('바르그',`<p>밤길. 사내가 솥 하나를 등에 지고 말없이 따라온다. 저택 가는 길 내내 아무 말이 없다.</p><p>저택 문 앞에서 사내가 멈춰 선다.</p><p>사내 — “…바르그. 이름.”</p><p>바르그 — “왜 도와줬어.”</p>`,
   [['국이 맛있어서',()=>SCENE.bargJ(0)],['도망친 사람을 넘기기 싫어서',()=>SCENE.bargJ(1)]]),
 bargJ:c=>{jr('녹슨 닻 여관 부엌에서 국을 끓이던 탈영병 바르그를 만났다. 헌병들이 그를 찾고 있었다.'+(S.bargL?' 저택 요리사라고 둘러댔다.':' 헌병들을 막아섰다.'));
   ev('바르그',(c?'<p>바르그 — “…도망친 사람.”</p><p class="m">바르그가 그 말을 입 안에서 굴린다. 부정하지 않는다.</p><p>바르그 — “나 밤에 이름 불러. 시끄러울 거야.”</p>':'<p class="m">바르그의 꼬리가 한 번 흔들린다.</p><p>바르그 — “…응. 맛있지. 알아.”</p><p>바르그 — “나 밤에 이름 불러. 시끄러울 거야.”</p>')+
   '<p>바르그 — “그래도 부엌 있으면. 밥은 해 줄게. 매일.”</p>',
   [[joinL('barg')==='같이 가자'?'저택에서 지내라':joinL('barg'),()=>{joinComp('barg');aff('barg',c?6:3);SCENE.joined('barg','…응. 부엌 어디야.')}],['갈 길을 가라',()=>{S.dec.barg=1;log('바르그와 함께 가지 않기로 했다.');ev('바르그','<p>바르그 — “…응. 여관 부엌에 있을게. 헌병 오기 전까지는.”</p><p class="m">바르그는 녹슨 닻 여관 부엌에 있다.</p>',[['돌아선다',null]],1);save()}]])},
 bargAgain:()=>ev('여관 부엌의 바르그','<p>바르그가 여전히 여관 부엌에서 솥을 젓고 있다. 나를 보고 그릇을 하나 꺼낸다.</p><p>바르그 — “…먹고 가. 그리고. 아직 그 저택 부엌 비어 있어?”</p>',
   [[joinL('barg')==='같이 가자'?'저택에서 지내라':joinL('barg'),()=>{delete S.dec.barg;joinComp('barg');SCENE.joined('barg','…솥 챙길게.')}],['아직이다',null]]),
 enoM:()=>ev('물길의 안내인',`<p>하수구를 나서려는데 아까 그 안내인이 물길 가장자리에 쪼그려 앉아 있다. 손바닥으로 푸르스름한 물을 떠서 마신다.</p><p class="m">물 위에 푸른 재 찌꺼기가 기름처럼 떠 있다.</p>
   <p>안내인 — “아 이거요? 걱정 마. 맛은 없어.”</p><p>안내인 — “에노라고 해요. 이 아래 물길 지도를 그려.”</p>`,
   [['그걸 왜 마셔?',()=>SCENE.eno2(1)],['길을 알려 줘서 고맙다',()=>SCENE.eno2(0)]]),
 eno2:c=>{jr('하수구에서 피트를 구할 때 길을 알려 준 안내인 에노를 만났다. 에노는 물길에 흘러든 푸른 재 찌꺼기를 떠 마셨다. 말투가 문장마다 바뀌었다.');
   ev('에노',(c?'<p>에노 — “버려진 기억이 물에 녹아 흘러와요. 그냥 두면 다 사라져.”</p><p>에노 — “…아. 지금 그 말은 할머니 목소리였지. 미안해요. 가끔 섞여.”</p>':'<p>에노 — “내가 구한 건 아니야. 나는 길만 알려 줬어요. 길 알려 주는 건 공짜.”</p>')+
   '<p>에노 — “근데 너희 집에 지하실 있어? 물길이 지나가는? …같이 가도 될까요. 위에서 지내 본 지 오래돼서.”</p>'+pline({kirien:'물 냄새 엄청 나. …나쁜 사람 냄새는 아니야.',oswin:'재 찌꺼기를 마신다고요. 학술원이 알면 이 사람부터 데려가겠군요.',ibre:'길을 알려 줬습니다. 좋은 사람입니다.',kasimir:'하수구의 시인이라. 동행이 점점 재미있어지는군요.',barg:'…배고파 보여. 같이 가자.'}),
   [[joinL('eno'),()=>{joinComp('eno');aff('eno',c?6:3);SCENE.joined('eno','좋아요! 지하실 물길부터 봐도 돼?')}],['하수구가 더 어울린다',()=>{S.dec.eno=1;log('에노와 함께 가지 않기로 했다.');ev('에노','<p>에노 — “그 말도 맞아. 운하 부두 하수구 입구에 있을게요. 생각 바뀌면 불러.”</p><p class="m">에노는 운하 부두 하수구 입구에 있다.</p>',[['돌아선다',null]],1);save()}]])},
 enoAgain:()=>ev('하수구 입구의 에노','<p>하수구 철창 옆에서 에노가 지도를 그리고 있다. 나를 보고 펜을 귀에 꽂는다.</p><p>에노 — “왔네요. 지하실 물길은 아직 막혀 있어?”</p>',
   [[joinL('eno'),()=>{delete S.dec.eno;joinComp('eno');SCENE.joined('eno','그럼 내가 뚫어 줄게.')}],['아직이다',null]]),
 mort0:()=>ev('문 앞의 노인',`<p>문을 열자 늙은 경비가 서 있다. 회색 수염에 등은 곧다. 손에 손때 묻은 참나무 막대를 쥐었다.</p><p>모르텐 — “가스등 거리 경비대 교관 모르텐일세. 경비들은 다 도망갔네. 거리 끝에 그게 또 나왔어. 꺼지지 않는 등불을 든 놈.”</p>
   <p>모르텐이 내 손을 흘끗 본다.</p><p>모르텐 — “손끝이 푸르군. 그럼 이 도시에서 더 잃을 것도 별로 없겠지. 따라오게.”</p>`,
   [['막대를 쥔 노인을 따라간다',()=>{S.mort=1;S.tutAsk=1;jr('첫날 밤 경비대 교관 모르텐이 문을 두드렸다. 거리 끝에 꺼지지 않는 등불을 든 사람이 나왔다고 했다. 길에 나서기 전에 박자부터 배웠다.');save();ev('여관 뒷마당',`<p>모르텐이 여관 뒷마당 가스등 아래 멈춰 선다. 막대 끝으로 돌바닥을 두 번 친다.</p><p>모르텐 — “거리에 나가기 전에 박자부터 맞춰 보세. 놈들은 칼보다 박자로 죽이네. 오래 안 걸려.”</p>`,[['막대 앞에 선다',()=>startBattle('tut')]],1)}]]),
 mortDie:()=>ev('모르텐',`<p>점등꾼이 쓰러진 자리에서 몇 걸음 떨어진 곳에 모르텐이 누워 있다. 숨이 얕다. 막대는 두 동강이 났다.</p><p>모르텐 — “박자가… 늦었네. 내가. 자네 말고.”</p>
   <p>모르텐 — “이 도시는 쓰러진 사람을 기다려 주지 않네. 자네는 서 있게. 끝까지.”</p><p class="m">모르텐의 손에서 힘이 빠진다.</p>`,
   [['그의 눈을 감겨 준다',()=>SCENE.mortCart(0)],['이름을 부른다',()=>SCENE.mortCart(1)]]),
 mortCart:c=>{S.mort=2;add('mstaff',1);jr('모르텐이 나를 밀쳐 내고 대신 등불을 맞았다. 새벽이 오기 전에 회색 마차가 와서 그를 자루에 담아 갔다. 경비대장은 서류에 도장을 찍었다. “사망자 기억 수거. 공급 하나.”');log('모르텐이 죽었다.');
   ev('새벽 전',(c?'<p>“모르텐.” 대답은 없다.</p>':'')+`<p>새벽이 오기 전에 회색 마차가 온다. 풀무를 멘 사내들이 말없이 모르텐을 자루에 담는다. 아무도 묻지 않는다. 누구였는지도. 무슨 일이 있었는지도.</p>
   <p>뒤늦게 나타난 경비대장이 서류에 도장을 찍는다.</p><p>경비대장 — “사망자 기억 수거. 공급 하나. 늙은이 하나면 등불 서른 개는 켜지. 운이 좋았어.”</p><p class="m">돌바닥에 부러진 막대 반쪽만 남았다.</p>`,
   [['막대를 줍는다',()=>SCENE.kirien()]])},
 kirien:()=>ev('여우 머리의 여자',(S.mort===2?'<p class="m">회색 마차가 모퉁이를 돌아 사라진다.</p>':'')+`<p>등불이 꺼진 자리에 누군가 쪼그려 앉아 있다. 여우 머리의 잉그라드다. 식은 심지를 손끝으로 뒤집어 본다.</p>
   <p>키리엔 — “늦었네. 석 달을 쫓았는데 네가 먼저 쓰러뜨렸어.”</p>${S.mort===2?'<p>키리엔이 마차가 사라진 쪽을 본다.</p><p>키리엔 — “회색 마차가 벌써 왔어? 저 사람들은 냄새를 맡고 와. 죽은 사람 냄새.”</p>':''}<p>키리엔 — “이 사람 마지막에 뭐라고 했어? 이름 같은 거.”</p>`,
   [['못 알아들었다고 말한다',()=>SCENE.kir2(0)],['누구냐고 묻는다',()=>SCENE.kir2(1)]]),
 kir2:c=>ev('키리엔',(c?'<p>키리엔 — “나? 키리엔. 변두리에서 사람 찾는 일을 해.”</p>':'<p>키리엔 — “그래. 나도 못 들었어. 그게 제일 아까워.”</p>')+
   `<p>키리엔 — “이 점등꾼은 석 달 전에 사라진 사람이야. 의뢰인은 이 사람 딸이고. 아빠가 등불을 들고 나가서 안 돌아왔대.”</p><p>키리엔 — “그런데 넌 왜 이 사람을 찾았어?”</p>`,
   [['편지를 보여 준다',()=>SCENE.kir3(1)],['말하지 않는다',()=>SCENE.kir3(0)]]),
 kir3:show=>{S.kshow=show?1:0;
   ev('키리엔',(show?'<p>키리엔이 편지를 한참 들여다본다. 귀가 한 번 뒤로 젖혀진다.</p><p>키리엔 — “네 글씨로 쓴 편지라. 쓴 기억은 없고. 웃기네. 하나도 안 웃긴데.”</p>':'<p>키리엔 — “말하기 싫으면 말아. 다들 그래.”</p>')+
   `<p>키리엔 — “아무튼 이 사람 머릿속은 재로 꽉 찼어. 누가 이렇게 만들었는지 알아내야 의뢰가 끝나.”</p><p>키리엔 — “너도 뭘 찾는 중이잖아. 같이 다니면 둘 다 빨리 찾을지도 몰라. 어때?”</p>`,
   [[joinL('kirien'),()=>{joinComp('kirien');aff('kirien',(S.kshow?6:0)+2);jr('점등꾼을 쫓던 여우 머리의 잉그라드 키리엔을 만났다. 함께 다니기로 했다.');SCENE.joined('kirien','키리엔 — “좋아. 대신 내 몫은 내가 챙겨.”','교단 구역으로 가는 길이 열렸다.')}],
    ['혼자 하겠다',()=>SCENE.kirNo()]])},
 kirNo:()=>{S.dec.kirien=1;jr('점등꾼을 쫓던 키리엔을 만났다. 함께 다니자는 말에 혼자 하겠다고 했다.');
   ev('키리엔','<p>키리엔 — “그래. 억지로 붙을 생각은 없어.”</p><p>키리엔 — “마음 바뀌면 가스등 거리 초소 앞으로 와. 거기서 의뢰인을 기다리니까.”</p><p class="m">키리엔은 가스등 거리 쪽으로 사라졌다. 교단 구역으로 가는 길이 열렸다.</p>',[['고개를 끄덕인다',null]],1)},
 kirAgain:()=>ev('키리엔','<p>초소 담벼락에 기대어 있던 키리엔이 귀를 세운다.</p><p>키리엔 — “또 왔네. 혼자 다니니까 어때?”</p>',
   [[joinL('kirien'),()=>{delete S.dec.kirien;joinComp('kirien');aff('kirien',(S.kshow?6:0));jr('가스등 거리 초소 앞에서 키리엔을 다시 만났다. 이번엔 함께 다니기로 했다.');SCENE.joined('kirien','키리엔 — “진작 그럴 것이지.”')}],['지나가던 길이다',null]]),
 joined:(id,line,more)=>{const away=S.party!==id,P=cn(S.party);
   ev(cn(id),`<p>${line}</p>`+(away?`<p>${P} — “${(COMP[S.party].hello||{})[id]||'짐은 알아서 옮기라고 해.'}”</p>`:'')+
   `<p class="m">${josa(cn(id),'이','가')} 함께하기로 했다.${away?` 지금은 ${josa(P,'과','와')} 다니고 있으니 ${josa(cn(id),'은','는')} ${S.base?'저택에서 지낸다':'여관 1층에서 기다린다'}. 데리고 나갈 사람은 ${S.base?'저택 동료의 방':'여관'}에서 바꿀 수 있다.`:''}${more?' '+more:''}</p>`,[['좋다',null]],1)},
 road:(foe,a)=>ev('길 위에서',`<p>${PL[a.fr].n}에서 ${PL[a.to].n}(으)로 가는 길. 가스등 하나가 꺼진 골목 앞에서 무언가 길을 막는다.</p><p class="m">${FOES[foe].intro}</p>`+
   pline({kirien:foe==='dog'?'배고픈 애야. 물리기 전에 쫓아 버려.':'저 칼 든 손 낯익은데.',oswin:'지름길이 늘 짧은 건 아니지요.'}),
   [['맞선다',()=>startBattle('fight',foe)],['돌아서 달아난다',()=>{const l=Math.min(S.coin,R(1,3));S.coin-=l;log('길 위에서 달아났다'+(l?'. 동전 '+l+'개를 흘렸다.':'.'));if(l)pop('달아났다',{n:['뛰다가 주머니에서 동전이 쏟아졌다.'],g:0,i:{}});save()}]]),
 archive:()=>ev('대성당 뒤편',`<p>문서고 쪽에서 책 무더기가 쏟아지는 소리가 난다.</p><p>책장 사이에 붉은 구릿빛 비늘의 파볼릭이 서 있다. 두꺼운 장부를 품에 안았다. 그 앞을 회색 옷의 정화자가 막아선다.</p>
   <p>정화자 — “장부를 내려놓아라. 이름 없는 자.”</p><p>파볼릭 — “이름 없는 자라. 지운 건 당신들인데 말이지요.”</p>`,
   [['끼어든다',()=>{S.bstory='oswin';save();startBattle('fight','warden')}],['물러난다',null]]),
 oswinW:()=>ev('오스윈',`<p>파볼릭이 장부의 먼지를 턴다. 머리가 문틀에 닿을 듯하다.</p><p>오스윈 — “고맙다고 해야겠지요. 저는 오스윈입니다. 아니, 오스윈이었지요. 학술원 서류에는 이제 없는 이름이라서.”</p>`+
   (S.party==='kirien'?'<p>키리엔 — “말 많네.”</p><p>오스윈 — “칭찬으로 듣겠습니다.”</p>':''),[['장부에 뭐가 있느냐고 묻는다',()=>SCENE.osw2()]],1),
 osw2:()=>{jr('대성당 문서고에서 학술원에서 쫓겨난 칼라쉬의 후예 오스윈을 만났다. 그가 훔친 장부에는 푸른 재가 된 사람들의 이름이 적혀 있었다.');
   ev('오스윈',`<p>오스윈 — “학술원이 교단에 넘긴 명단이지요. 가스등에 쓸 푸른 재를 어디서 얻는지 아십니까.”</p>
   <p>오스윈 — “사람에게서 얻습니다. 기억을 태운 재지요. 이 장부에는 그 사람들 이름이 적혀 있습니다. 적혀 있었다고 해야 맞겠군요. 반은 지워졌으니.”</p>
   <p>오스윈 — “당신이 찾는 것도 여기 어딘가에 있을지 모릅니다. 저는 지워진 쪽을 찾고 있고요. 같이 다니는 편이 서로 덜 귀찮겠지요.”</p>`,
   [[joinL('oswin'),()=>{joinComp('oswin');aff('oswin',2);SCENE.joined('oswin','오스윈 — “그럼 짐을 싸지요. 장부는 제가 듭니다.”',S.comps.length>=2?'여관에 돌아가 쉴 곳을 의논해 보자.':'')}],
    ['각자 갈 길을 간다',()=>SCENE.oswNo()]])},
 oswNo:()=>{S.dec.oswin=1;
   ev('오스윈','<p>오스윈 — “현명하십니다. 저와 엮이면 대개 서류에서 이름이 사라지거든요.”</p><p>오스윈 — “생각이 바뀌면 이 문서고로 오십시오. 정화자들이 다시 올 때까지는 여기 숨어 있을 테니.”</p>',[['돌아선다',null]],1)},
 oswAgain:()=>ev('오스윈','<p>책장 사이에서 붉은 구릿빛 꼬리가 삐죽 나와 있다.</p><p>오스윈 — “또 뵙는군요. 정화자들이 저를 잊어 주질 않아서 여기 숨어 지냅니다.”</p>',
   [[joinL('oswin'),()=>{delete S.dec.oswin;joinComp('oswin');jr('대성당 문서고에서 오스윈을 다시 만났다. 이번엔 함께 다니기로 했다.');SCENE.joined('oswin','오스윈 — “마침 숨어 지내는 것도 지겨웠지요.”',S.comps.length>=2?'여관에 돌아가 쉴 곳을 의논해 보자.':'')}],['그냥 둔다',null]]),
 manorRumor:()=>{S.mr=1;jr('녹슨 닻 여관 주인에게서 노래가 들린다는 오르빌 저택 이야기를 들었다.');
   ev(LODGE,`<p>여관 주인이 셋을 번갈아 본다.</p><p>“방 하나에 셋은 무리야. 운하 따라 내려가면 오르빌 저택이 있어. 주인이 죽은 지 십 년이 넘었지.”</p>
   <p>“그런데 밤마다 노래가 들린대. 가사도 없이 이름 하나를 길게 늘여 부르는 소리가. 그것만 없으면 빈집이야.”</p><p>“그 집 사정은 가스등 거리 늙은 점등꾼 브리타가 잘 알 거야. 그 할멈은 이 도시가 어두웠던 때를 기억하거든.”</p>`,
   [['브리타를 찾아가 보기로 한다',null]],1)},
 brita:()=>ev('늙은 점등꾼 브리타',`<p>초소 맞은편 가스등 아래 허리가 굽은 노파가 장대를 짚고 서 있다.</p><p>브리타 — “오르빌 저택? 그 집 노래라면 나도 들었지. 사십 년 전 그 집 주인이 처음으로 푸른 재를 사들였어. 그땐 다들 박수를 쳤단다. 밤이 밝아진다고.”</p>
   <p>브리타 — “우리 할머니는 손끝으로 촛불을 켰어. 주문을 외면서. 나도 그 주문을 다 배웠지. 그런데 지금은 한 줄도 말이 안 돼. 배운 건 기억나는데 말은 하나도 안 나와.”</p><p class="m">브리타가 입술을 달싹인다. 머리 위 가스등 불꽃이 잠깐 내 쪽으로 기운다.</p>`,
   [['주문이 사라졌다는 거야?',()=>SCENE.brita2(0)],['오르빌은 누구를 불러?',()=>SCENE.brita2(1)]]),
 brita2:c=>{S.mr=2;jr('늙은 점등꾼 브리타를 만났다. 그녀는 할머니에게 배운 주문을 기억하지만 한 줄도 말로 꺼낼 수 없다고 했다. 오르빌 가문은 교단 묘지에 묻혔다.');
   ev('늙은 점등꾼 브리타',(c?'<p>브리타 — “몰라. 들으면 잊혀. 그 집 노래는 그래.”</p>':'<p>브리타 — “사라진 게 아니야. 어딘가 있는데 손이 안 닿는 느낌이지. 이 나이가 되면 그런 게 많아. 그런데 이건 나만 그런 게 아니더라고. 겨울 시대 노인들이 다 그래.”</p>')+
   '<p>브리타 — “오르빌 사람들은 교단 묘지 북쪽 끝에 묻혔어. 비석을 보면 뭔가 알지도 모르지.”</p>'+pline({kirien:'주문이 머릿속에 있는데 입으로 안 나온다고? 그거 무섭다.',oswin:'배운 건 남았는데 말이 사라졌다라. 학자로서는 흥미롭고 사람으로서는 무섭군요.'}),[['묘지로 가 보기로 한다',null]],1)},
 tomb:()=>{S.manor=1;jr('교단 묘지에서 오르빌 가문의 무덤을 찾았다. 비문은 정으로 긁혀 있었다. “겨울이 끝난 해 … 불을 거둔 이 … 여기 잠들지 않는다.” 무덤 문 틈에 저택 열쇠가 끼워져 있었다.');
   ev('오르빌 가문의 무덤',`<p>묘지 북쪽 끝. 이끼 낀 가족묘에 오르빌 상회의 닻 문장이 새겨져 있다. 비문 대부분이 정으로 긁혀 나갔다.</p><p class="m">남은 글자 — “겨울이 끝난 해 … 불을 거둔 이 … 여기 잠들지 않는다.”</p>`+
   (S.party==='oswin'?'<p class="m">오스윈의 꼬리 끝에서 불꽃이 튄다. 비석에 가까이 갈수록 세게.</p>':pline({kirien:'누가 일부러 긁었어. 이름을 지우려고. 교단 장부처럼.'}))+(S.party==='oswin'?'<p>오스윈 — “이 돌은 뭔가를 기억하는군요. 저보다 오래.”</p>':'')+
   `<p>무덤 문 틈에 녹슨 열쇠 하나가 끼워져 있다. 누가 두고 간 것처럼. 손잡이에 오르빌 저택의 문장이 있다.</p><p class="m">지도에 오르빌 저택이 나타났다. 옆 납골당 계단에 누군가 앉아 이쪽을 보고 있다.</p>`,[['열쇠를 챙긴다',null]],1)},
 manorIn:()=>ev('오르빌 저택',`<p>현관문은 잠겨 있지 않다. 안은 바깥보다 차갑다.</p><p>위층에서 노래가 들린다. 가사는 없다. 이름 하나를 길게 늘여 부르는 소리다.</p>`+
   pline({kirien:'노래 들려? 나만 들리는 거 아니지?',oswin:'재에 먹힌 사람은 마지막으로 붙든 걸 끝까지 놓지 않지요. 이 집 주인은 이름을 붙든 모양입니다.'}),
   [['위층으로 올라간다',()=>{S.bstory='manor';save();startBattle('fight','singer')}],['오늘은 돌아간다',null]]),
 manorW:()=>{S.base=1;S.manor=1;S.vis.base=1;const L=S.legacy;if(L&&RELIC[L.pa])S.inv.relic=1;
   log('오르빌 저택이 본거지가 되었다.');jr('오르빌 저택의 노래를 잠재웠다. 노래하던 이름은 알아듣지 못했다. 저택이 우리 본거지가 되었다.');
   ev('오르빌 저택',`<p>노래가 그쳤다. 낡은 옷 속에 푸른 재만 한 줌 남았다.</p><p>벽난로 위 초상화의 얼굴은 지워져 있다. 그 아래 놋쇠 판에는 이름 대신 긁힌 자국뿐이다.</p>
   <p>노래하던 이름은 끝내 알아듣지 못했다. 점등꾼이 중얼거리던 소리와 닮았던 것 같다.</p>`+
   pline({kirien:'유령 나온 집에서 살자고? …뭐, 여관비는 아끼겠네.',oswin:'서재가 있군요. 책은 다 젖었지만 말리면 됩니다. 대부분은요.'})+

 mgs:()=>{const id=S.mgsId;S.mgsId=null;if(!MGB[id])return;S.mgs[id]=1;const hid=S.mgh==='hide';
   const M={kirien:{p:'<p class="m">싸움이 끝나자 키리엔이 칼을 넣지도 않고 다가온다. 귀가 뒤로 붙었다.</p><p>키리엔 — “방금 그거. 손에서 나온 거.”</p><p>키리엔 — “엄마가 평생 흉내만 내던 거야. 천막에서 손님들 앞에서. 진짜는 처음 봐.”</p>'+(hid?'<p>키리엔 — “언제부터 할 줄 알았어. 왜 말 안 했어.”</p>':''),
       c:[['나도 무섭다',4,'<p>키리엔 — “…그럼 됐어. 무서운 줄 알면.”</p><p>키리엔 — “혼자 무서워하지 마. 나도 반쯤은 무서우니까.”</p>'],['언덕에서 처음 나왔다',2,'<p>키리엔 — “처음이라고. 처음 하는 사람 손이 아니던데.”</p><p class="m">귀가 한 번 움찔한다.</p>']]},
     oswin:{p:'<p class="m">오스윈의 꼬리 끝에서 불꽃이 쉬지 않고 튄다. 본인도 멈추지 못하는 듯하다.</p><p>오스윈 — “제 비늘은 남은 찌꺼기를 튀길 뿐입니다. 방금 그건 찌꺼기가 아니었습니다.”</p><p>오스윈 — “백 년 동안 칼라쉬의 후예들이 유리관 안에서 찾던 겁니다. 학술원이 제 비늘을 긁어 가며 찾던 것. 당신은 그걸 그냥… 말했어요.”</p><p>오스윈 — “어디서 배웠습니까.”</p>',
       c:[['모른다. 입이 먼저 기억했다',4,'<p>오스윈 — “입이 먼저. …학자로서는 최악의 대답이고 동료로서는 들어 본 중 가장 무서운 대답이군요.”</p><p>오스윈 — “장부에 적지 않겠습니다. 이런 건 적는 순간 누군가 가져갑니다.”</p>'],['학술원 강의실에서 처음 나왔다',2,'<p>오스윈 — “그 강의실에서요.”</p><p class="m">오스윈이 무언가 말하려다 삼킨다.</p><p>오스윈 — “아닙니다. 우연이겠지요. 우연이 조금 많지만.”</p>']]},
     ibre:{p:'<p class="m">이브레가 한참 나를 내려다본다. 삼 미터 위에서.</p><p>이브레 — “비늘이 섰습니다. 무서울 때 이럽니다.”</p><p>이브레 — “저는 무서운 게 별로 없습니다.”</p>',
       c:[['미안하다',4,'<p>이브레 — “사과할 일 아닙니다. 다만 다음엔 먼저 말해 주십시오. 앞에 서는 건 제 일이니까.”</p>'],['나도 처음이다',3,'<p>이브레 — “그렇습니까. 그럼 둘 다 처음입니다.”</p>']]},
     barg:{p:'<p class="m">바르그가 한참 내 손을 본다. 털이 다 섰다가 천천히 가라앉는다.</p><p>바르그 — “천막에서… 비슷한 불 봤어. 아니. 달라. 그건 차가웠어. 네 건 따뜻해.”</p><p>바르그 — “…밥 먹고 얘기하자.”</p>',
       c:[['무서웠어?',3,'<p>바르그 — “응. 근데 네가 무서운 건 아니야.”</p>'],['같이 밥 먹자',4,'<p class="m">바르그가 고개를 끄덕인다. 그날 국에는 고기가 두 배였다.</p>']]},
     eno:{p:'<p class="m">에노가 비틀거리며 이마를 짚는다.</p><p>에노 — “내 안에서 다들 동시에 소리 질렀어요. 할머니도 병사도 아이도.”</p><p>에노 — “‘그 목소리다.’ 다들 그래. 나는 무슨 말인지 몰라.”</p>',
       c:[['무슨 목소리?',2,'<p>에노 — “몰라요. 물이 너무 흔들려서 안 보여. 가라앉으면 알려 줄게.”</p>'],['괜찮아?',4,'<p>에노 — “응. 이제 조용해. …네 옆이라 그런가.”</p>']]},
     kasimir:{p:'<p class="m">카시미르가 손뼉을 천천히 세 번 친다. 웃고 있는데 눈은 웃지 않는다.</p><p>카시미르 — “아아. 그래서였군요. 어디서 뵌 것 같더라니.”</p><p>카시미르 — “농담입니다. …절반쯤은.”</p><p>카시미르 — “교단은 불을 모시지만 불을 다루는 사람은 태우시죠. 아무 데서나 보여 주시면 곤란합니다.”</p>',
       c:[['어디서 나를 봤는데?',2,'<p>카시미르 — “말씀드렸잖습니까. 농담이라고.”</p><p class="m">붉은 병을 한 번 흔든다.</p><p>카시미르 — “언젠가 제가 많이 취하면 여쭤보시죠.”</p>'],['숨겨 달라',4,'<p>카시미르 — “숨기는 건 제 특기시죠. 귀족이란 그런 겁니다.”</p><p class="m">웃음이 조금 늦게 돌아온다.</p>']]}}[id];
   ev(cn(id),M.p,M.c.map(([l,g,r])=>[l,()=>{aff(id,g);jr(`${josa(cn(id),'이','가')} 내가 주문을 쓰는 것을 보았다.`);ev(cn(id),r,[['다른 이야기는 다음에',null]],1)}]))},
 britaM:()=>{const re=S.bm===2;
   const head=re?'<p>브리타가 심지를 갈다가 나를 본다.</p><p>브리타 — “또 왔네. 이번엔 들어 볼 마음이 생겼어?”</p>':S.mgh==='open'?'<p>초소 맞은편에서 브리타가 장대를 짚고 기다리고 있다.</p><p>브리타 — “소문 들었어. 언덕에서 손끝으로 불을 켠 사람이 있다고. 너지?”</p><p class="m">대답하기도 전에 브리타가 고개를 끄덕인다. 이미 안다는 얼굴이다.</p>':'<p>브리타가 가스등 심지를 갈고 있다. 나를 보고 손을 멈춘다.</p><p>브리타 — “저택은 어때. 노래는 그쳤어? …얼굴이 변했네. 뭔가 있었구나.”</p>';
   ev('늙은 점등꾼 브리타',head+'<p>브리타 — “할머니 주문을 하나 들려줄까. 소리는 안 나와도 입 모양은 기억해. 바람 부는 밤에 촛불을 지키던 주문이야.”</p><p class="m">브리타의 입술이 소리 없이 움직인다. 혀끝에서 그 말이 소리를 얻으려 한다.</p>',
   [['소리 내어 따라 읊는다',()=>SCENE.britaM2(1)],['입을 다문다',()=>SCENE.britaM2(0)]])},
 britaM2:c=>{if(!c){S.bm=2;ev('늙은 점등꾼 브리타','<p>브리타가 웃는다.</p><p>브리타 — “그래. 그게 낫겠지. 말이 안 나오는 게 나은 날도 있어.”</p>',[['고개를 숙인다',null]],1);return}
   S.bm=1;if(!S.sk.includes('windward'))S.sk.push('windward');if(S.party)S.mgs[S.party]=1;jr('브리타의 입 모양을 따라 그녀의 할머니가 외던 주문을 소리 내어 읊었다. 가스등 불꽃이 바람도 없는데 기울었다. 브리타는 할머니 목소리 같다고 했다.');
   ev('늙은 점등꾼 브리타','<p>말이 입 밖으로 나오자 머리 위 가스등 불꽃이 바람도 없는데 한쪽으로 기울었다가 곧게 선다. 브리타의 장대가 돌바닥에 떨어진다.</p><p>브리타 — “…할머니 목소리야.”</p><p class="m">한참 뒤.</p><p>브리타 — “아니. 네 목소리지. 그런데 할머니가 외던 박자 그대로야. 나는 끝까지 소리를 못 냈는데 너는 어떻게.”</p><p>브리타가 내 손을 잡는다. 손이 떨린다.</p><p>브리타 — “아무 데서나 하지 마. 이 도시 가스등은 그 소리를 알아들어. 방금 봤지.”</p>'+
   pline({kirien:'할머니 목소리래. 너 지금 누구 목소리로 말한 거야.',oswin:'남이 기억하는 주문을 당신이 소리 내는군요. 그럼 주문은 어디에 있는 겁니까.',ibre:'불이 절을 했습니다.',kasimir:'노부인을 울리시다니. 나쁜 분이시죠.'})+'<p class="m">새 주문 — 바람막이</p>',[['손을 놓는다',null]],1)},
 hagM:()=>{const re=S.hm===2;
   ev('잉그라드 하그',(re?'<p>하그가 한쪽 눈만 뜬다.</p><p>하그 — “또 왔군. 오늘은 뭐가 보이나?”</p>':S.mgh==='open'?'<p>하그가 깃털을 부풀린 채 나를 노려본다.</p><p>하그 — “언덕 이야기 들었어. 넝마 시장 꼬마들 입이 빨라. 이리 와 봐.”</p>':'<p>하그가 천막 앞에서 하얀 책을 무릎에 펴 두고 졸고 있다. 발소리에 눈을 뜬다.</p><p>하그 — “마침 잘 왔어. 젊은 눈엔 뭐가 보이나 싶어서.”</p>')+'<p>하그 — “이 쪽을 읽어 봐. 하얀 데를.”</p><p class="m">하얀 종이에 손이 닿자 종이가 미지근하다.</p>',
   [['하얀 쪽을 소리 내어 읽는다',()=>SCENE.hagM2(1)],['아무것도 안 보인다고 한다',()=>SCENE.hagM2(0)]])},
 hagM2:c=>{if(!c){S.hm=2;ev('잉그라드 하그','<p>하그 — “그래? 내 눈엔 뭔가 보일 것 같았는데. 늙은이 헛것이지.”</p>',[['천막을 나선다',null]],1);return}
   S.hm=1;if(!S.sk.includes('nightsong'))S.sk.push('nightsong');if(S.party)S.mgs[S.party]=1;jr('하그의 하얀 주문책을 소리 내어 읽었다. 숨 한 번 쉴 동안 하얀 종이에 잉크가 떠올랐다가 사라졌다. 하그는 종이가 나를 기억하는 것처럼 군다고 했다.');
   ev('잉그라드 하그','<p>입을 여는 순간 하얀 종이 위로 잉크가 한 줄 떠오른다. 숨 한 번 쉴 동안. 그리고 다시 하얘진다.</p><p class="m">하그의 깃털이 한꺼번에 선다.</p><p>하그 — “…누구냐 너.”</p><p>하그 — “겨울 시대 사람들도 그렇게는 못 읽었어. 종이가 너를 기억하는 것처럼 굴잖아.”</p><p>하그 — “방금 그건 밤새의 노래야. 우리 엄마가 나를 재우던. 가져가. 나는 이제 불러 줄 아이도 없어.”</p>'+
   pline({kirien:'종이가 너를 기억한대. …농담이지?',oswin:'종이가 기억한다. 하그 씨는 은유를 쓰신 거겠지요. 그래야 합니다.',ibre:'잉크가 돌아왔다가 갔습니다. 손님처럼.',kasimir:'책이 반가워하는 얼굴이었습니다. 오래된 친구를 본 것처럼요.'})+'<p class="m">새 주문 — 밤새의 노래</p>',[['책을 돌려준다',null]],1)},
 pitM:()=>ev('벽난로 앞의 피트','<p>피트가 벽난로 앞에 쪼그려 앉아 부싯돌을 몇 번이나 긋는다. 젖은 장작이 연기만 낸다.</p><p>피트 — “이거 왜 안 돼. 어제 비 맞은 거 주워 와서 그래.”</p>',
   [['손끝을 장작에 댄다',()=>SCENE.pitM2(1)],['부싯돌을 받아 대신 긋는다',()=>SCENE.pitM2(0)]]),
 pitM2:c=>{if(!c){S.pm=2;ev('벽난로 앞의 피트','<p>불은 세 번 만에 붙는다.</p><p>피트 — “나도 할 줄 아는데. 오늘만 안 된 거야.”</p>',[['고개를 끄덕인다',null]],1);return}
   S.pm=1;jr('저택 벽난로에 손끝으로 불을 붙였다. 피트가 보았다.');
   ev('벽난로 앞의 피트','<p>손끝이 닿자 젖은 장작 속에서 불이 일어난다. 푸른 재 냄새가 나지 않는 불이다.</p><p class="m">피트가 뒤로 엉덩방아를 찧는다. 한참 입을 벌리고 있다.</p><p>피트 — “…그거 또 해 봐.”</p><p>피트 — “하수구에 할머니가 하나 있었는데 옛날엔 그런 걸로 불을 켰대. 다들 거짓말이라 그랬어.”</p>'+
   (S.mgh==='open'?'<p>피트 — “부두 애들이 다 떠들던 게 진짜였네. 손에서 불 나는 사람.”</p>':'<p>피트 — “아무한테도 말 안 해. 하수구 애들은 비밀 잘 지켜. 넬한테는 말해도 돼? 안 돼? …알았어.”</p>'),[['피트 머리를 쓰다듬는다',null]],1)},
 kq1:()=>ev('하얀 요양소',`<p>언덕 끝의 하얀 건물. 창마다 쇠창살이 있다. 문지기가 장부를 펼친 채 졸고 있다.</p><p>키리엔이 장부를 슬쩍 돌려 본다. 손가락이 한 줄에서 멈춘다.</p><p class="m">“석 달 전 입소. 점등꾼 토벤. 분류: 공급 대기.”</p>
   <p>키리엔 — “공급 대기. 사람한테 쓰는 말이 아니잖아.”</p><p>키리엔 — “낮엔 못 들어가. 밤에 다시 오자. 문지기 말고 다른 게 지킨대.”</p>`,
   [['밤에 다시 오기로 한다',()=>{S.kq=1;jr('학술원 요양소 장부에서 토벤의 이름을 찾았다. 분류는 “공급 대기”였다.')}]],1),
 kq2:()=>ev('밤의 요양소',`<p>달이 가려진 밤. 요양소 뒷문의 자물쇠는 키리엔의 머리핀 하나에 열린다.</p><p>복도 안쪽에서 풀무가 숨 쉬는 소리가 들린다. 바닥에 푸른 재가 길게 끌린 자국이 있다.</p><p>키리엔 — “저 소리. 회색 마차 사람들이야.”</p>`,
   [['안으로 들어간다',()=>{S.bstory='kq2';save();startBattle('fight','collector')}],['오늘은 돌아간다',null]]),
 kq2W:()=>{S.kq=2;aff('kirien',3);jr('요양소 깊은 방에서 토벤을 찾았다. 그는 딸의 이름을 몰랐다. 내 이름만 알았다. 그를 업고 에다의 집으로 데려갔다.');
   ev('요양소 깊은 방',`<p>복도 끝 방. 침대 하나에 마른 남자가 누워 있다. 눈은 뜨고 있지만 아무것도 보지 않는다. 손에는 식은 심지 하나를 쥐었다.</p><p>키리엔 — “토벤 씨. 에다가 기다려요.”</p>${S.awl?'<p class="m">옆 침대에 그 강의실의 아이가 누워 있다. 학술원 심부름꾼 옷을 입었다. 눈을 뜨고 있지만 나를 보고도 아무 표정이 없다.</p>':''}
   <p>대답이 없다. 남자의 눈이 천천히 움직여 키리엔을 지나 나에게서 멈춘다.</p><p>토벤 — “…${esc(S.name)}.”</p>
   <p class="m">그는 그 말만 하고 다시 천장을 본다. 몇 번을 물어도 내 이름만 되풀이한다.</p><p>키리엔 — “너를 알아. 딸 이름은 몰라도 네 이름은 알아.”</p>
   <p>키리엔 — “일단 에다네 집으로 데려가자. 머릿속을 채울 방법은 그다음에 생각해. 가스등 거리 뒷골목에 기억 전당포가 있어. 거기선 기억을 사고판대.”</p>`,[['토벤을 업는다',null]],1)},
 kq3:()=>{const told=(S.chd||{}).kirien>=4;
   ev('기억 전당포',`<p>가스등 거리 뒷골목. 유리병이 천장까지 쌓인 가게. 병마다 푸른 안개가 고여 있고 꼬리표가 달렸다.</p><p>주인 노파가 돋보기 너머로 키리엔을 본다.</p>
   <p>오델 — “그 귀. 미라의 딸이로구나. 네 엄마가 여기 단골이었지. 사러 온 게 아니라 팔러.”</p>`+(told?'<p>키리엔 — “알아요.”</p><p class="m">키리엔이 내 쪽을 한 번 본다. 이미 들은 이야기다.</p>':'<p class="m">키리엔의 귀가 딱 굳는다. 아무 말도 하지 않는다.</p>')+
   `<p>오델 — “아비의 기억을 찾는다고? 남의 것이라도 괜찮다면 있지. 딸을 키운 사내의 기억 한 병. 이름은 다르지만 사랑하는 법은 같아. 동전 스물.”</p>`,
   [['산다 (동전 20)',()=>SCENE.kqBuy(1)],['사지 않는다',()=>SCENE.kqBuy(0)]])},
 kqBuy:b=>{const told=(S.chd||{}).kirien>=4;
   if(b&&S.coin<20){ev('기억 전당포','<p>동전이 모자라다.</p><p>오델 — “돈이 생기면 다시 와. 이 병은 잘 안 팔려. 다들 제 아비 기억을 원하지 남의 아비는 원하지 않거든.”</p>',[['돌아선다',null]],1);if(S.kq===2){S.kq=3;S.outs=1;jr('기억 전당포에서 키리엔의 엄마가 기억을 팔았다는 것을 알았다.')}return}
   if(b){S.coin-=20;add('mem',1);log('남의 아버지의 기억을 샀다.')}
   if(S.kq===2){S.kq=3;S.outs=1;jr('기억 전당포에서 키리엔의 엄마가 기억을 팔았다는 것을 알았다.'+(b?' 딸을 키운 낯선 사내의 기억 한 병을 샀다.':''))}
   ev('기억 전당포',(b?'<p>오델이 병을 천으로 싸서 건넨다. 생각보다 가볍다.</p>':'<p>오델 — “마음이 바뀌면 와. 병은 기다려 주니까.”</p>')+
   (told?'<p>키리엔 — “엄마 기억도 저 병들 중에 있을까. …찾으면 안 될 것 같아. 찾으면 사고 싶어질 테니까.”</p>':'<p>밖으로 나오자 키리엔이 짧게 말한다.</p><p>키리엔 — “엄마 얘기는 나중에 할게. 지금은 토벤 씨가 먼저야.”</p>')+
   '<p>키리엔 — “엄마한테 가 보자. 변두리에 있어. …알아보지는 못할 거야.”</p><p class="m">지도에 변두리가 열렸다.</p>',[['고개를 끄덕인다',null]],1)},
 kqM:()=>ev('엄마의 천막',`<p>천막촌 끝. 낡은 천막 입구에 여우 머리의 늙은 여자가 앉아 있다. 키리엔과 같은 붉은 털이 하얗게 셌다.</p><p>미라 — “손님이구나. 손을 줘 봐요. 잊은 걸 봐 줄게.”</p><p class="m">키리엔이 말없이 손을 내민다.</p><p>미라 — “…너는 엄마를 잃어버렸구나. 가엾어라.”</p><p>키리엔 — “…응. 잃어버렸어.”</p>`,[['나도 손을 내민다',()=>SCENE.kqM2()]]),
 kqM2:()=>{S.kq=4;aff('kirien',3);jr('변두리에서 키리엔의 엄마 미라를 만났다. 미라는 딸을 알아보지 못했다. 내 손을 잡더니 이렇게 말했다. “잊은 게 너무 많아. 그런데 남은 것도 네 게 아니구나.”');
   ev('엄마의 천막','<p>미라가 내 손을 잡는다. 그리고 흠칫 놓는다.</p><p>미라 — “너는… 잊은 게 너무 많아. 그런데 남은 것도 네 게 아니구나. 하나도.”</p><p>미라의 눈이 흐려진다. 다시 처음 보는 사람을 보는 얼굴이다.</p><p>미라 — “손님이구나. 손을 줘 봐요.”</p><p>돌아가는 길에 키리엔이 묻는다.</p><p>키리엔 — “엄마가 한 말. 남은 것도 네 게 아니라는 거. 무슨 뜻이야?”</p><p class="m">대답할 수 없다.</p><p>키리엔 — “…엄마 점은 틀린 적이 없어. 그게 무서워.”</p><p class="m">에다의 집에서 소식이 오면 다시 찾아가자.</p>',[['고개를 끄덕인다',null]],1)},
 kqD:()=>{S.kq=5;jr('에다의 집 벽은 토벤의 숯 그림으로 가득했다. 유리 지붕과 끝없는 계단과 내 얼굴. 토벤은 나를 선생님이라고 불렀다.');
   ev('에다의 집','<p>다락방 벽이 숯 그림으로 가득하다. 유리 지붕. 끝없는 계단. 그리고 같은 얼굴이 수십 번.</p><p>내 얼굴이다.</p><p>에다 — “아빠가 매일 밤 그려요. 다 그리면 이렇게 불러요.”</p><p>토벤이 숯을 내려놓고 나를 본다.</p><p>토벤 — “…선생님. 늦으셨습니다.”</p><p>키리엔 — “선생님? 너 이 사람이랑 무슨 사이였어?”</p><p class="m">기억나지 않는다. 그런데 토벤이 그린 계단의 모양을 나는 알고 있다.</p>',[['그림 한 장을 챙긴다',null]],1)},
 kqC:()=>ev('에다의 집',`<p>가스등 거리 끝 다락방. 토벤은 창가 의자에 앉아 꺼진 등잔을 만지작거린다. 에다가 그 옆에 쪼그려 앉아 있다.</p>
   <p>에다 — “아빠가 저를 몰라요. 그래도 등잔은 알아요. 매일 밤 심지를 갈아요. 불도 안 켜면서.”</p><p>키리엔 — “어떻게 할지는 에다가 정해야 해. 근데 에다는 네 말을 듣고 싶대.”</p>`+
   (S.inv.mem?'':'<p class="m">남의 기억을 부어 주려면 기억 전당포에서 병을 사 와야 한다.</p>'),
   (S.inv.mem?[['남의 기억을 부어 준다',()=>SCENE.kqEnd('pour')]]:[]).concat([['빈 채로 처음부터 알아 가게 한다',()=>SCENE.kqEnd('new')],['교단 구호소에 맡겨 쉬게 한다',()=>SCENE.kqEnd('rest')],['아직 정하지 못했다',null]])),
 kqEnd:k=>{S.kq=6;S.kqe=k;S.cq.kirien='done';
   const E={pour:[3,'<p>병마개를 열자 푸른 안개가 토벤의 숨으로 스민다. 토벤이 눈을 깜박인다. 그리고 에다를 본다.</p><p>토벤 — “…리나야. 밥은 먹었니.”</p><p>에다는 한참 대답하지 않는다. 그러다 고개를 끄덕인다.</p><p>에다 — “응. 먹었어, 아빠.”</p><p>키리엔 — “다른 이름으로 불러도 아빠가 웃잖아. 그거면 된 거겠지. …된 거겠지?”</p>','토벤에게 낯선 사내의 기억을 부어 주었다. 그는 에다를 다른 이름으로 부르며 웃었다.'],
     new:[6,'<p>에다가 토벤의 손을 잡는다.</p><p>에다 — “아빠. 나는 에다야. 아빠 딸이야. 오늘부터 하나씩 다시 알려 줄게.”</p><p>토벤이 그 손을 오래 내려다본다. 그리고 아주 작게 따라 말한다.</p><p>토벤 — “…에다.”</p><p>키리엔 — “처음부터라. 엄마한테도 그렇게 해 볼걸 그랬나.”</p>','토벤은 빈 채로 집에 돌아갔다. 에다가 처음부터 하나씩 알려 주기로 했다. 그는 딸의 이름을 처음으로 따라 말했다.'],
     rest:[2,'<p>교단 구호소의 수녀가 토벤의 어깨에 담요를 덮는다. 에다는 등잔을 품에 안고 오래 서 있다.</p><p>에다 — “아빠가 이 등잔을 켜던 거 기억해요. 내가 기억하면 돼요.”</p><p>키리엔 — “…그래. 기억하는 사람이 하나는 있어야지.”</p>','토벤을 교단 구호소에 맡겼다. 에다는 아버지 대신 등잔을 기억하기로 했다.']}[k];
   if(k==='pour')add('mem',-1);aff('kirien',E[0]);jr(E[2]);log('키리엔의 이야기 「등불을 든 사람」을 마쳤다.');
   ev('등불을 든 사람',E[1]+`<p>돌아가는 길에 키리엔이 말한다.</p><p>키리엔 — “그 사람 너를 선생님이라고 불렀어. 딸 이름보다 먼저. 나 그거 안 잊을 거야. 네가 누구였든.”</p><p class="m">키리엔의 이야기 「등불을 든 사람」이 끝났다.</p>`,[['고개를 끄덕인다',null]],1)},
 pqask:()=>{S.pq=2;S.outs=1;log('변두리로 가는 길이 열렸다.');jr('부두 짐꾼에게서 피트가 넝마 시장 수레에 실려 갔다는 말을 들었다. 변두리로 가는 길이 열렸다.');
   ev('부두 짐꾼',`<p>짐꾼 — “그 꼬마? 성벽 밖에서 넝마 시장 사람들이 수레에 태워 가던데. 잠든 애들을 자루처럼 쌓아서.”</p><p>짐꾼 — “변두리에선 애들 꿈을 산대. 싸게. 애들 꿈은 금방 다시 자라니까 괜찮다나.”</p>`+pline({kirien:'다시 자란다고? 누가 그래. 사는 쪽이 그러겠지.',oswin:'아이들 기억은 재가 곱다고 학술원 보고서에 적혀 있었지요. 제가 읽은 가장 역겨운 문장입니다.'})+'<p class="m">지도에 변두리가 열렸다.</p>',[['변두리로 간다',null]],1)},
 pqtent:()=>ev('넝마 시장 뒷천막',`<p>천막 안에 철창이 줄지어 있다. 아이들이 잠들어 있다. 손끝이 하나같이 파랗다.</p><p>철창 사이를 가면 쓴 사람이 오간다. 가면 아래로 깔때기가 늘어져 있다. 잠든 아이 입가에 깔때기를 대고 숨을 들이켠다.</p><p>구석 철창에서 피트의 갈고리가 보인다.</p>`,
   [['철창으로 다가간다',()=>{S.bstory='pq';save();startBattle('fight','ashman')}],['일단 물러난다',null]]),
 pqW:()=>ev('넝마 시장 뒷천막',`<p>철창을 열자 피트가 눈을 뜬다. 한참 이쪽을 본다.</p><p>피트 — “…나 누구였더라?”</p>`,
   [['피트. 하수구에서 노래하던 아이',()=>SCENE.pqW2()],['우리 저택 심부름꾼 피트',()=>SCENE.pqW2()]]),
 pqW2:()=>{S.pq=3;if(S.kids&&S.kids.pit)S.kids.pit.st='hurt';jr('넝마 시장 뒷천막에서 피트를 구했다. 피트는 제 이름을 잠깐 잊었다가 되찾았다. 다른 아이들 몇은 끝내 제 이름을 대지 못했다.');log('피트를 구했다.');
   ev('피트',`<p>피트가 입술을 달싹인다.</p><p>피트 — “…맞아. 피트. 성은 몰라.”</p><p class="m">다른 철창의 아이들도 풀어 주었다. 몇은 집이 어딘지 기억했다. 몇은 제 이름을 대지 못했다. 그 아이들은 교단 구호소로 보냈다.</p>`+pline({kirien:'이름을 못 대는 애들. 나중에 내가 찾아 줄게. 그게 내 일이니까.',oswin:'이름을 잃은 아이들이라. 장부에 한 줄씩 적어 두겠습니다. 언젠가 돌려줄 수 있게.'})+'<p class="m">피트는 지쳐 있다. 저택 아이들 방에서 돌봐 줘야 한다.</p>',[['피트를 업는다',null]],1)},
 hag:()=>{const h=S.hq||0;
   if(h===0)ev('주문을 외는 노인',`<p>천막 앞에 늙은 잉그라드가 앉아 있다. 부엉이 머리의 깃털이 다 셌다. 손을 들어 낯선 말을 중얼거린다. 아무 일도 일어나지 않는다.</p><p>하그 — “젊을 땐 이 말로 불을 켰어. 지금은 그냥 말이야. 그런데 이상하지. 말은 하나도 안 잊었어.”</p><p>하그 — “내 주문책을 넝마 시장 녀석들이 훔쳐 갔어. 천막 사이 어딘가에 굴러다닐 거야. 찾아 주면 사례하지.”</p>`,[['찾아 주겠다고 한다',()=>{S.hq=1;jr('변두리에서 주문을 외는 노인 하그를 만났다. 주문책을 찾아 달라고 했다.');save()}],['그냥 지나간다',null]]);
   else if(h===2)ev('주문을 외는 노인',`<p>하그가 주문책을 받아 펼친다. 손이 떨린다. 주문이 적혀 있던 자리마다 종이가 하얗다. 여백의 낙서와 장보기 목록만 남았다.</p><p class="m">책을 건네받을 때 하얀 쪽이 손바닥에 닿는다. 종이가 미지근하다.</p><p>하그 — “잉크가 바랜 게 아니야. 이 책은 겨울이 끝나고 스무 해쯤 지나서 하얘졌어. 하룻밤에. 세상 모든 주문책이 그날 밤 하얘졌지.”</p><p>하그가 제 머리를 손가락으로 두드린다.</p><p>하그 — “그런데 주문은 여기 남아 있어. 종이에서 사라진 게 머릿속에는 남았다니. 그럼 마법은 어디로 간 걸까.”</p>`+
     pline({kirien:'머릿속이라. 그럼 그게 재가 되면…. 아니야. 아무것도.',oswin:'…기억 속으로요. 아니, 근거 없는 말입니다. 잊어 주십시오.'}),
     [['책을 돌려준다',()=>SCENE.hagEnd(0)],['학술원에 알리자고 한다',()=>SCENE.hagEnd(1)]]);
   else ev('주문을 외는 노인','<p>하그가 고개를 든다.</p><p>하그 — “책은 찾았나? 넝마 시장 녀석들은 천막 사이에 뭐든 버려.”</p>',[['고개를 끄덕인다',null]],1)},
 hagEnd:c=>{S.hq=3;add('grim',-1);const n=['<p>하그 — “'+(c?'학술원? 그 녀석들이 이런 걸 왜 모으는지 알고 하는 말이야? 겨울 시대 노인들 꿈을 사 가는 놈들이야. 안 돼.':'고맙네. 하얀 종이라도 내 책이야. 내가 기억하는 동안은.')+'”</p>','<p class="m">하그가 낡은 부적 하나와 동전을 쥐여 준다. 부적에서 아주 희미하게 따뜻한 기운이 느껴진다. 착각일지도 모른다.</p>'];
   S.coin+=10;jr('하그에게 주문책을 돌려주었다. 세상의 주문책은 겨울이 끝나고 스무 해 뒤 하룻밤에 하얘졌다고 한다. 주문은 사람들 머릿속에만 남았다.');
   ev('주문을 외는 노인',n.join(''),[['고개를 숙인다',null]],1);const X=gainXp(20);if(X.length>1)setTimeout(()=>pop('하그의 사례',{n:X}),0)},

/* ===================== 저장 정화 (1편 scs/scrub) ===================== */
const WTAG=/<\/?(?:b|i|em|strong|br|p|span)(?: class=(?:'[\w -]*'|"[\w -]*"|[\w-]+))?\s*\/?>/gi,sesc=t=>t.replace(/[<>]/g,'').replace(/['"`\\]/g,'’');
function scs(x){let o='',i=0;x.replace(WTAG,(m,off)=>{o+=sesc(x.slice(i,off))+m;i=off+m.length;return m});return o+sesc(x.slice(i))}
function scrub(v,d){d=d||0;if(d>40)return null;if(typeof v=='string')return scs(v);if(Array.isArray(v))return v.map(x=>scrub(x,d+1));if(v&&typeof v=='object'){const o={};for(const k of Object.keys(v)){if(!/^[\w:.\-]{1,64}$/.test(k)||k=='__proto__'||k=='constructor'||k=='prototype')continue;o[k]=scrub(v[k],d+1)}return o}return typeof v=='number'?(isFinite(v)?v:0):typeof v=='boolean'||v===null?v:null}

/* 기록 코드: 압축한 저장을 글자로. 2편은 KS2, 1편은 KS0/KS1 */
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
async function gz(raw){return new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer())}
async function gunz(bin){return new Uint8Array(await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())}
async function scode(){const raw=new TextEncoder().encode(JSON.stringify(S));try{return 'KS2.'+b64(await gz(raw))}catch(e){return 'KS2r.'+b64(raw)}}
async function rawDecode(c){
  c=String(c||'').replace(/\s+/g,'');const m=/^KS(0|1|2|2r)\.(.+)$/.exec(c);if(!m)throw 0;
  const bin=Uint8Array.from(atob(m[2]),x=>x.charCodeAt(0));
  const raw=(m[1]=='1'||m[1]=='2')?await gunz(bin):bin;
  return {ver:m[1][0],o:scrub(JSON.parse(new TextDecoder().decode(raw)))};
}
async function sdecode(c){const {ver,o}=await rawDecode(c);if(ver!=='2'||!o||!RACE[o.race]||!o.inv)throw 0;return o}
// 1편 기록에서 필요한 것만 읽는다: 이름·종족·출신·계통·엔딩·데리고 다닌 동료
async function legacyDecode(c){
  const {ver,o}=await rawDecode(c);if(ver==='2'||!o||!RACE1[o.race])throw 0;
  const str=x=>typeof x=='string'?x.replace(/<[^>]*>/g,'').slice(0,24):'';
  return {name:str(o.name)||'이름 없는 여행자',race:o.race,og:str(o.og),tr:str(o.tr),end:END1[o.end]?o.end:'',pa:RELIC[o.pa]?o.pa:''};
}

function morph(P,h){const T=document.createElement('template');T.innerHTML=h;msync(P,T.content)}
function msync(o,n){const oc=[...o.childNodes],nc=[...n.childNodes];nc.forEach((b,i)=>{const a=oc[i];if(!a){o.appendChild(b);return}if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName||(a.nodeType==1&&a.id!==b.id)){o.replaceChild(b,a);return}if(a.nodeType!=1){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}if(a.isEqualNode(b))return;mattr(a,b);msync(a,b)});for(let i=oc.length-1;i>=nc.length;i--)o.removeChild(oc[i])}
function mattr(a,b){for(const x of [...a.attributes])if(!b.hasAttribute(x.name))a.removeAttribute(x.name);for(const x of b.attributes)if(a.getAttribute(x.name)!==x.value)a.setAttribute(x.name,x.value);if((a.nodeName=='INPUT'||a.nodeName=='TEXTAREA')&&a!==document.activeElement&&a.type!='file'&&a.value!==(b.getAttribute('value')||''))a.value=b.getAttribute('value')||'';if(a.nodeName=='DETAILS')a.open=b.hasAttribute('open')}

/* ============================================================
   전투 — 턴제 + 타이밍 (시제품 p3을 옮김)
   startBattle(kind, foe): kind = fight(실전) | tut(가르침) | practice(박자 연습)
   ============================================================ */
let G={on:false};
const bfoe=()=>G.kind==='tut'?TUTF:FOES[G.foe];
const btier=()=>{if(G.kind==='tut')return TIER[0];if(G.kind==='practice')return TIER[Math.min(3,1+S.night)];const F=bfoe();return TIER[G.ph===2&&F.tier2!=null?F.tier2:F.tier]};
const bsafe=()=>G.kind!=='fight';
const BW=()=>{const D=DF(),m=(G.guard?1.3:1)*(G.wide?1.3:1)*btier().w*(1+(sv(2)-3)*.03);return{d:D.d*m,p:D.p*m*(G.stance?1.5:1),g:D.d*m*1.6}}; // g: 일찍 누르면 스침. 정신이 높을수록 판정이 넓다
const sv=i=>G.kind==='fight'?S.st[i]:5; // 전투에서 쓰는 능력치(가르침·연습은 5로 고정)
const dAtk=st=>5+st[0];
const dHeavy=(st,perf)=>Math.round((10+1.6*st[0])*(perf?1.7:1));

/* 소리 */
let AC=null;
function ac(){if(!CFG.snd)return null;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){AC=null}return AC}
function tone(f,d,type,v,f2){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,a.currentTime);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);g.gain.setValueAtTime(v||.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d+.02)}
function noise(d,v,hp){const a=ac();if(!a)return;const n=a.sampleRate*d,buf=a.createBuffer(1,n,a.sampleRate),c=buf.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||1500;const g=a.createGain();g.gain.value=v||.07;s.connect(f).connect(g).connect(a.destination);s.start()}
const SND={warn:()=>tone(520,.08,'sine',.035),dodge:()=>noise(.12,.06,2200),parry:()=>{tone(1760,.35,'triangle',.07);tone(2640,.25,'sine',.04)},
  hit:()=>{tone(110,.2,'sine',.16,55);noise(.08,.05,400)},slash:()=>{noise(.1,.05,1200);tone(300,.12,'triangle',.05,140)},perfect:()=>{tone(990,.2,'triangle',.06);noise(.08,.05,1800)},whiff:()=>tone(200,.08,'square',.025)};

/* 캔버스 */
const cv=$('#bcv'),cx=cv.getContext('2d');let COL={},DPR=1,CW=320;
function readCols(){const s=getComputedStyle(document.documentElement);['--a','--t','--m','--bad','--kw','--b','--al'].forEach(k=>COL[k]=s.getPropertyValue(k).trim())}
window.addEventListener('resize',()=>{if(typeof G!=='undefined'&&G&&G.on){sizeCv()}});
function sizeCv(){DPR=Math.min(2,window.devicePixelRatio||1);CW=cv.clientWidth||320;cv.width=CW*DPR;cv.height=CW*DPR}
function radius(b,t){
  const el=t-(b.T-b.a);if(el<0)return null;
  if(b.f){const[s,h]=b.f;if(el<s)return 1+2.2*(1-.75*el/s);if(el<s+h)return 1.55+Math.sin(el/22)*.025;const rem=b.a-s-h,q=(el-s-h)/rem;return 1+.55*(1-q)}
  return 1+2.2*(1-el/b.a);
}
function draw(){
  const t=now(),c=cx,R=CW*.15,M=CW/2;
  c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,CW,CW);
  c.strokeStyle=COL['--b'];c.lineWidth=1;c.beginPath();c.arc(M,M,R*3.2,0,7);c.stroke();
  c.beginPath();c.moveTo(M,M-R*3.45);c.lineTo(M+5,M-R*3.45+5);c.lineTo(M,M-R*3.45+10);c.lineTo(M-5,M-R*3.45+5);c.closePath();c.fillStyle=COL['--al'];c.fill();
  const enemy=G.st==='enemy',breathe=enemy?1:1+Math.sin(t/700)*.02;
  c.strokeStyle=COL['--a'];c.lineWidth=2;c.globalAlpha=enemy?1:.55;c.beginPath();c.arc(M,M,R*breathe,0,7);c.stroke();c.globalAlpha=1;
  c.save();c.translate(M,M);c.strokeStyle=COL['--a'];c.lineWidth=1.5;c.globalAlpha=enemy?.9:.5;const L=R*.42;
  c.beginPath();c.moveTo(-L*.45,-L*.55);c.lineTo(L*.45,-L*.55);c.lineTo(L*.6,L*.6);c.lineTo(-L*.6,L*.6);c.closePath();c.stroke();
  c.beginPath();c.moveTo(-L*.25,-L*.55);c.lineTo(0,-L*.95);c.lineTo(L*.25,-L*.55);c.stroke();
  c.beginPath();c.moveTo(-L*.75,L*.6);c.lineTo(L*.75,L*.6);c.stroke();
  c.fillStyle=COL['--kw'];c.globalAlpha=(enemy?.55:.3)+Math.sin(t/180)*.08;c.beginPath();c.ellipse(0,L*.05,L*.18,L*.3,0,0,7);c.fill();c.restore();c.globalAlpha=1;
  const nx=G.beats.filter(b=>!b.res).sort((x,y)=>x.T-y.T)[0];
  for(const b of G.beats){
    if(b.res)continue;let k=radius(b,t);if(k===null)continue;if(t>b.T)k=Math.max(.55,1-(t-b.T)/400);
    const first=b===nx;c.globalAlpha=Math.min(1,(t-(b.T-b.a))/160)*(first?1:.38);c.strokeStyle=COL['--t'];c.lineWidth=first?(b.f?3:2.6):1.2;
    c.beginPath();c.arc(M,M,R*k,0,7);c.stroke();
    if(b.f){c.setLineDash([3,5]);c.lineWidth=1;c.beginPath();c.arc(M,M,R*k+5,0,7);c.stroke();c.setLineDash([])}
  }
  c.globalAlpha=1;
  G.fx=G.fx.filter(f=>t-f.t<(f.k==='slash'?700:320));
  for(const f of G.fx){
    if(f.k==='slash'){const p=(t-f.t)/700;c.strokeStyle=f.gold?COL['--kw']:COL['--t'];c.lineWidth=f.gold?3:2;c.globalAlpha=1-p;const e=Math.min(1,p*3);c.beginPath();c.moveTo(M-R*1.4,M-R*1.1);c.lineTo(M-R*1.4+R*2.8*e,M-R*1.1+R*2.2*e);c.stroke();continue}
    // 성공·실패 효과는 과녁 안쪽에서만: 바깥에서 다가오는 고리와 겹치지 않게
    const p=(t-f.t)/320,q=1-p;
    if(f.k==='parry'){c.strokeStyle=COL['--kw'];c.lineWidth=2;c.globalAlpha=q;c.beginPath();c.arc(M,M,R,0,7);c.stroke();
      for(let i=0;i<8;i++){const a=i/8*6.283+f.r,r1=R*(.95-p*.25),r2=R*(.7-p*.35);c.beginPath();c.moveTo(M+Math.cos(a)*r1,M+Math.sin(a)*r1);c.lineTo(M+Math.cos(a)*r2,M+Math.sin(a)*r2);c.stroke()}}
    if(f.k==='dodge'){c.fillStyle=COL['--t'];c.globalAlpha=q*.16;c.beginPath();c.arc(M,M,R,0,7);c.fill();c.strokeStyle=COL['--t'];c.lineWidth=1.5;c.globalAlpha=q*.7;c.beginPath();c.arc(M,M,R*(.92-p*.3),0,7);c.stroke()}
    if(f.k==='hit'){c.fillStyle=COL['--bad'];c.globalAlpha=q*.4;c.beginPath();c.arc(M,M,R,0,7);c.fill()}
  }
  c.globalAlpha=1;
}

/* 흐름 */
function startBattle(kind,foe){
  ac();EV0=null;POP=null;render();
  G={on:true,kind,foe:foe||(kind==='practice'?'drill':null),st:'wait',hp:kind==='fight'?S.hp:100,mhp:kind==='fight'?S.mhp:100,fp:2,band:kind==='fight'?(S.inv.band||0):0,
     fhp:0,ph:1,guard:false,open:false,next:null,cur:null,beats:[],fx:[],lock:0,turn:0,tg:0,tut:kind==='tut'?0:null,last:null,q:null,
     S:{dodge:0,parry:0,hit:0,graze:0,whiff:0,full:0,ofs:[],perf:0,qte:0}};
  G.fhp=bfoe().hp;
  $('#bt').classList.add('on');$('#blog').innerHTML='';sizeCv();readCols();
  $('#bstop').hidden=kind==='fight'||(kind==='tut'&&!S.tutd);$('#bstop').textContent=kind==='tut'?'가르침 건너뛰기':'연습 끝내기';
  if(kind==='tut'){brender();tutStep()}
  else if(kind==='practice'){G.next=bpick();blog('박자 연습. 모르텐이 막대를 휘두른다. 피해는 없다.');brender();setTimeout(()=>{if(G.on&&G.st==='wait')enemyTurn()},900)}
  else{const F=bfoe();G.next=bpick();brender();bov(`<h2>${F.n}</h2><p>${F.intro}</p>${F.tier>1?'<p class="m">밤이 깊어졌다. 박자가 빨라진다.</p>':''}`+bbtns([['fgo','맞선다',1]]))}
  requestAnimationFrame(bloop);

function bpick(){
  if(G.kind==='tut')return TS[G.tut].mv;
  const F=bfoe(),pool=G.ph===2&&F.pool2?F.pool2:F.pool;
  let m;do{m=pool[Math.random()*pool.length|0]}while(m===G.last&&pool.length>1);G.last=m;return m;
}
function playerTurn(){G.st='player';G.cDone=false;G.turn++;if(G.turn>1)G.fp=Math.min(5,G.fp+1);G.guard=false;if(!G.next&&G.kind!=='tut')G.next=bpick();brender()}

function bact(a,k){
  ac();if(G.st!=='player')return;if(G.kind==='tut'&&a!=='heavy')return;
  if(a==='skill'){G.menu='skill';brender();return}

  if(e.repeat){if(G.st==='enemy'||G.st==='qte')e.preventDefault();return}
  if(G.st==='qte'&&(k===' '||k==='f'||k==='j'||k==='enter')){e.preventDefault();press('qte',ts);return}
  if(G.st==='enemy'){if(k===' '||k==='f'){e.preventDefault();press('dodge',ts)}else if(k==='j'){e.preventDefault();press('parry',ts)}}
  if(G.st==='player'){const m={'1':'atk','2':'heavy','3':'skill','4':'guard','5':'band'}[k];if(m){const btn=document.querySelector(`[data-ba="${m}"]`);if(btn&&!btn.disabled)bact(m)}}
});
window.addEventListener('resize',()=>{if(G.on)sizeCv()});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',readCols);

/* ===================== 개발자 창 ===================== */
function devInit(){
  try{FAST=localStorage.getItem('k2fast')==='1'}catch(e){}
  $('#devb').hidden=false;$('#bdev').classList.add('on');
}
function devOpen(){
  const s=S;const b=(c,l,a)=>`<button class="btn" data-dv="${c}"${a!=null?` data-a="${a}"`:''}>${l}</button>`;
  $('#dov').innerHTML=`<div class="pcard dev"><h2>개발</h2>
  <div class="seg">${b('fast','즉시 완료: '+(FAST||TEST?'켬':'끔'))}${s?b('finish','진행 중인 일 끝내기'):''}</div>
  ${s?`<h3>진행</h3><div class="seg">${b('night','밤 0',0)}${b('night','밤 1',1)}${b('night','밤 2',2)}${b('night','밤 3',3)}</div>
  <div class="seg">${b('heal','체력 가득')}${b('coin','동전 +50')}${b('band','붕대 +5')}${b('tut','가르침 처음부터')}${b('comp','다음 동료 합류 ('+s.comps.length+')')}${b('aff','데려간 동료 호감 +20')}${b('base','본거지 얻기')}${b('pit','피트 얻기')}${b('scrap','고철 +10')}${b('fixall','저택 모두 고치기')}${b('enc','길 위 마주침: '+(ENC_ON?'켬':'끔'))}${b('act1','1막 끝으로 (에다 직전)')}${b('pqgo','피트 실종 일으키기')}${b('rev','이야기 단계: '+({1:'1막',2:'2막',2.5:'2막 후반',3:'3막'})[actN()]+' → 다음')}${b('outs','변두리 열기')}${b('kq','키리엔 퀘스트 다음 단계 ('+(s.kq||0)+')')}${b('mg','주문: '+(s.mg?'깨어남':'아직'))}${b('aev','데려간 동료 다음 호감 이벤트')}</div>
  <h3>전투</h3><div class="seg">${b('fight','골목개','dog')}${b('fight','도둑','thief')}${b('fight','점등꾼','lamp')}${b('fight','점등꾼 격노 직전','lamp2')}${b('fight','정화자','warden')}${b('fight','노래하는 옛 주인','singer')}${b('fight','쥐 떼','rats')}${b('fight','태엽 경비','clock')}${b('fight','유리관에서 나온 것','glass')}${b('fight','회색 수거인','collector')}${b('fight','그림자','shade')}${b('fight','덩어리','lump')}${b('fight','변이한 들개','mutt')}${b('fight','텅 빈 자','hollow')}${b('fight','재 짜는 사람','ashman')}${b('fight','유리 지붕 수거인 격노 직전','awc2')}${b('fight','교단 추적자','hunter')}</div>
  <h3>이야기</h3><div class="seg">${b('pro','시작 연출 다시')}${b('leg','1편 기억: '+(s.legacy?(s.legacy.end||'없음'):'없음'))}${b('state','상태 보기')}</div>
  <textarea id="dvs" readonly style="display:none"></textarea>`:'<p class="m">캐릭터를 만들면 진행 도구가 나온다.</p>'}
  <div class="btns">${'<button class="btn pri" data-dv="close">닫기</button>'}</div><p class="m" style="text-align:center">${VER} · 이 창은 게임 주인과 내 컴퓨터에서만 보인다</p></div>`;
  $('#dov').classList.add('on');
}
const DV={
  fast:()=>{FAST=!FAST;try{localStorage.setItem('k2fast',FAST?'1':'0')}catch(e){}},
  finish:()=>{if(S.act)S.act.t0=Date.now()-S.act.d*1000-1;S.disp.forEach(d=>d.t0=Date.now()-d.d*1000-1);Object.values(S.kids||{}).forEach(K=>{if(K.until)K.until=0});save()},
  night:a=>{S.night=+a;log('[개발] 밤 '+a);save()},
  heal:()=>{S.hp=S.mhp;save()},coin:()=>{S.coin+=50;save()},band:()=>{add('band',5);save()},
  tut:()=>{S.tutd=0;S.tutAsk=0;save()},scrap:()=>{add('scrap',10);save()},fixall:()=>{FIXN.forEach(k=>S.fix[k]=1);log('[개발] 저택을 모두 고쳤다');save()},enc:()=>{ENC_ON=!ENC_ON},
  rev:()=>{if(!S.eda){S.eda=1;S.acad=1}else if(!S.rev)S.rev=1;else if(!S.a3)S.a3=1;else{S.rev=0;S.a3=0}log('[개발] 이야기 단계 '+actN());save()},
  pqgo:()=>{if(!S.pit){S.pit=1;S.kids=S.kids||{};S.kids.pit={st:'ok'}}S.kids.pit.st='lost';S.pq=1;S.eda=S.eda||1;log('[개발] 피트 실종');save()},outs:()=>{S.outs=1;save()},
  act1:()=>{S.night=Math.max(S.night,3);S.tutd=1;['kirien','oswin'].forEach(joinComp);if(!S.base){S.base=1;S.manor=1;S.vis.base=1}S.pit=1;log('[개발] 1막 끝 직전');save()},
  kq:()=>{if(!S.acad){S.eda=1;S.acad=1}if(!S.comps.includes('kirien'))joinComp('kirien');S.party='kirien';if((S.kq||0)<3)S.kq=(S.kq||0)+1;log('[개발] 키리엔 퀘스트 '+S.kq);save()},
  comp:()=>{const nx=Object.keys(COMP).find(k=>!S.comps.includes(k));if(nx){joinComp(nx);if(nx==='kirien'&&S.night<3)S.night=3}},
  base:()=>{devClose();grantBase();render();return 1},pit:()=>{devClose();grantPit();render();return 1},aff:()=>{if(S.party)aff(S.party,20);save()},
  fight:a=>{devClose();if(a==='awc2'){S.mg=0;startBattle('fight','awc');G.fhp=Math.ceil(FOES.awc.hp/2)+5;bbars();return 1}if(a==='lamp2'){startBattle('fight','lamp');G.fhp=Math.ceil(FOES.lamp.hp/2)+5;bbars()}else startBattle('fight',a);return 1},
  pro:()=>{devClose();prologue();return 1},
  leg:()=>{const order=['k','r','w',''];const cur=S.legacy?S.legacy.end:'';const nx=order[(order.indexOf(cur)+1)%order.length];
    S.legacy=nx?{name:'시험용 여행자',race:'p',og:'칼라쉬',tr:'남색 서리비늘',end:nx,pa:'fox'}:null;if(S.legacy&&S.base)S.inv.relic=1;save()},
  state:()=>{const t=$('#dvs');t.style.display='';t.value=S.comps.map(id=>`${cn(id)} 호감 ${S.aff[id]||0} · ${affTier(id)}단계 ${affName(id)}`).join('\n')+'\n\n'+JSON.stringify(S,null,1);return 1},
  mg:()=>{if(S.mg){S.mg=0;S.sk=S.sk.filter(k=>!SKL[k].mg)}else{S.mg=1;S.mgw='spirit';S.mgh=S.mgh||'hide';if(!S.sk.includes('spirit'))S.sk.push('spirit')}log('[개발] 주문 '+(S.mg?'깨어남':'잠듦'));save()},
  aev:()=>{const id=S.party;if(!id||!AEV[id])return;const T=AEVT.find(t=>(S.aev[id]||0)<t);if(!T)return;S.aff[id]=Math.max(S.aff[id]||0,(T-1)*10);if(T>=8&&actN()<2){S.eda=1;S.acad=1}S.aevT=0;const e=AEV[id][T];S.aevK=id+':'+T;devClose();SCENE.aev();return 1},
  close:()=>{devClose();return 1}
};
function devClose(){$('#dov').classList.remove('on');$('#dov').innerHTML=''}
$('#devb').addEventListener('click',e=>{e.currentTarget.blur();if(DEV)devOpen()});
$('#dov').addEventListener('click',e=>{const b=e.target.closest('[data-dv]');if(!b||!DEV)return;const keep=DV[b.dataset.dv](b.dataset.a);if(!keep){render();devOpen()}});
$('#bt').addEventListener('click',e=>{const b=e.target.closest('[data-bdev]');if(!b||!DEV||!G.on||G.kind!=='fight')return;b.blur();
  if(G.st==='end')return;if(b.dataset.bdev==='win')G.fhp=0;else G.hp=0;G.beats=[];bbars();checkEnd()});

window.__k2={AEV,aevNext,actN,met,KIDS,DSP,QA,CSK,cst,affName,TALK,CH,chNext,KQ,FIX,DECO,BOOK,comfort,comfortT,travelSec,roadFoe,get ENC_ON(){return ENC_ON},set ENC_ON(v){ENC_ON=v},SKL,OSK,gainXp,useSkill,get MW(){return MW},COMP,affTier,romOK,romReady,SCENE,EXP,joinComp,grantBase,grantPit,get DEV(){return DEV},get S(){return S},get PV(){return PV},ORIGIN,set S(v){S=v},get G(){return G},get C(){return C},CFG,FOES,TS,MV,press,bact,startBattle,endBattle,render,save,load,tick,scode,sdecode,legacyDecode,BW,TEST};
applyTheme();load();if(DEV)devInit();render();if(S&&S.pro!==99)prologue();setInterval(tick,500);caps();
