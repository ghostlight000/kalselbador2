<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>칼셀바도르: 푸른 재</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* ===== 테마: 1편 팔레트(양피지/숯빛) ===== */
:root{--k0:#2e261d;--k1:#463a2c;--k2:#5f5141;--k3:#7a6b58;--k4:#978871;--k5:#b4a68d;--k6:#cfc3aa;--k7:#e8dec8;--bg:#cbbfa5;--c:#e5dac3;--c2:#d9ccb0;--t:#2b241c;--m:#64584a;--a:#7a5a2c;--al:rgba(122,90,44,.45);--b:rgba(70,52,30,.20);--bad:#8e3b2b;--g:rgba(110,80,40,.09);--kw:#b8782c;--gauge:rgba(70,52,30,.14);
--bo:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><polygon points='5.21,0.50 26.79,0.50 31.50,5.21 31.50,26.79 26.79,31.50 5.21,31.50 0.50,26.79 0.50,5.21' fill='none' stroke='%237a5a2c' stroke-opacity='.7'/></svg>");
--bf:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><polygon points='5.21,0.50 26.79,0.50 31.50,5.21 31.50,26.79 26.79,31.50 5.21,31.50 0.50,26.79 0.50,5.21' fill='%23c3b08a' stroke='%237a5a2c'/></svg>");
--pn:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><polygon points='8.21,0.50 23.79,0.50 31.50,8.21 31.50,23.79 23.79,31.50 8.21,31.50 0.50,23.79 0.50,8.21' fill='%23e5dac3' stroke='%237a5a2c' stroke-opacity='.5'/><polygon points='9.86,4.50 22.14,4.50 27.50,9.86 27.50,22.14 22.14,27.50 9.86,27.50 4.50,22.14 4.50,9.86' fill='none' stroke='rgba(70,52,30,.13)'/></svg>");
color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--k0:#0d0b08;--k1:#1a1611;--k2:#28221b;--k3:#383026;--k4:#453b2f;--k5:#564a3b;--k6:#706150;--k7:#958569;--bg:#1c1a17;--c:#26231f;--c2:#2f2b26;--t:#e6dcc8;--m:#a89c86;--a:#b89a62;--al:rgba(184,154,98,.45);--b:rgba(200,180,140,.16);--bad:#bb5a40;--g:rgba(184,154,98,.08);--kw:#e3a65a;--gauge:rgba(0,0,0,.35);
--bo:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><polygon points='5.21,0.50 26.79,0.50 31.50,5.21 31.50,26.79 26.79,31.50 5.21,31.50 0.50,26.79 0.50,5.21' fill='none' stroke='%23b89a62' stroke-opacity='.7'/></svg>");
--bf:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><polygon points='5.21,0.50 26.79,0.50 31.50,5.21 31.50,26.79 26.79,31.50 5.21,31.50 0.50,26.79 0.50,5.21' fill='%23463e32' stroke='%23b89a62'/></svg>");
--pn:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><polygon points='8.21,0.50 23.79,0.50 31.50,8.21 31.50,23.79 23.79,31.50 8.21,31.50 0.50,23.79 0.50,8.21' fill='%2326231f' stroke='%23b89a62' stroke-opacity='.5'/><polygon points='9.86,4.50 22.14,4.50 27.50,9.86 27.50,22.14 22.14,27.50 9.86,27.50 4.50,22.14 4.50,9.86' fill='none' stroke='rgba(200,180,140,.10)'/></svg>");
color-scheme:dark}}
:root[data-theme=dark]{--k0:#0d0b08;--k1:#1a1611;--k2:#28221b;--k3:#383026;--k4:#453b2f;--k5:#564a3b;--k6:#706150;--k7:#958569;--bg:#1c1a17;--c:#26231f;--c2:#2f2b26;--t:#e6dcc8;--m:#a89c86;--a:#b89a62;--al:rgba(184,154,98,.45);--b:rgba(200,180,140,.16);--bad:#bb5a40;--g:rgba(184,154,98,.08);--kw:#e3a65a;--gauge:rgba(0,0,0,.35);
--bo:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><polygon points='5.21,0.50 26.79,0.50 31.50,5.21 31.50,26.79 26.79,31.50 5.21,31.50 0.50,26.79 0.50,5.21' fill='none' stroke='%23b89a62' stroke-opacity='.7'/></svg>");
--bf:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><polygon points='5.21,0.50 26.79,0.50 31.50,5.21 31.50,26.79 26.79,31.50 5.21,31.50 0.50,26.79 0.50,5.21' fill='%23463e32' stroke='%23b89a62'/></svg>");
--pn:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><polygon points='8.21,0.50 23.79,0.50 31.50,8.21 31.50,23.79 23.79,31.50 8.21,31.50 0.50,23.79 0.50,8.21' fill='%2326231f' stroke='%23b89a62' stroke-opacity='.5'/><polygon points='9.86,4.50 22.14,4.50 27.50,9.86 27.50,22.14 22.14,27.50 9.86,27.50 4.50,22.14 4.50,9.86' fill='none' stroke='rgba(200,180,140,.10)'/></svg>");
color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t);font:15px/1.6 "Gowun Batang","Noto Serif KR",serif;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:break-word}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2,h3,.brand,.fn{font-family:"Nanum Myeongjo","Noto Serif KR",serif;font-weight:800}
h1{font-size:26px;margin:0;color:var(--a);letter-spacing:.08em;text-align:center}
.sub1{text-align:center;font:800 15px "Nanum Myeongjo",serif;letter-spacing:.4em;color:var(--m);margin:2px 0 8px}
h2{font-size:17px;margin:0 0 8px;color:var(--a)}
h3{font-size:14px;margin:12px 0 6px;color:var(--m);letter-spacing:.05em}
p{margin:6px 0}
.m{color:var(--m);font-size:13px}
b.g{color:var(--a)}
.btn{font:inherit;color:var(--t);background:none;border:8px solid transparent;border-image:var(--bo) 6 / 8px stretch;padding:3px 10px;cursor:pointer;min-height:42px;touch-action:manipulation;user-select:none;-webkit-user-select:none;text-align:center}
.btn:hover:not(:disabled),.btn:focus-visible{border-image:var(--bf) 6 fill / 8px stretch;outline:none}
.btn.pri,.btn.on{border-image:var(--bf) 6 fill / 8px stretch}
.btn:disabled{opacity:.38;cursor:default}
.btn.sm{min-height:34px;padding:0 6px;font-size:13px}
.btn small{display:block;font-size:11px;color:var(--m);line-height:1.25}
.card{position:relative;border:14px solid transparent;border-image:var(--pn) 12 fill / 14px stretch;padding:8px 10px;margin-bottom:12px}
.seg{display:flex;flex-wrap:wrap}
.seg .btn{flex:1 1 0;min-height:38px;font-size:13px;padding:0 4px}
.bar{position:relative;height:8px;background:var(--gauge);border:1px solid var(--b);margin:3px 0 6px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--a);transition:width .3s}
.bar.hp i{background:var(--bad)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.row span:last-child{color:var(--a)}
details>summary{cursor:pointer;list-style:none;color:var(--m);font-size:13px}
details>summary::-webkit-details-marker{display:none}
details>summary:before{content:"◇ ";color:var(--a)}
details[open]>summary:before{content:"◆ "}
textarea,input[type=text]{font:inherit;color:var(--t);background:var(--g);border:1px solid var(--b);padding:6px 8px;width:100%}
textarea{min-height:68px;font-size:12px}
kbd{font:12px/1 "Gowun Batang",serif;border:1px solid var(--al);padding:2px 5px;color:var(--t)}

/* ===== 배치 ===== */
#app{max-width:1180px;margin:0 auto;padding:10px 14px 30px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.brand{color:var(--a);font-size:17px;letter-spacing:.06em}
.brand b{font-size:13px;color:var(--m);font-family:"Gowun Batang",serif}
.tabs{display:flex;gap:2px;flex:1;justify-content:center}
.top>.btn{margin-left:auto}
.tab{font:inherit;background:none;border:0;color:var(--m);padding:6px 12px;cursor:pointer;position:relative;font-size:15px}
.tab.on{color:var(--t)}
.hbn{font-style:normal;color:var(--kw);font-size:11px}
.tab.on:after{content:"";position:absolute;left:50%;bottom:0;width:7px;height:7px;background:var(--a);transform:translateX(-50%) rotate(45deg)}
.grid{display:grid;grid-template-columns:290px 1fr 270px;gap:14px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}.grid .L{order:1}.grid .M{order:0}.grid .Rr{order:2}.tabs{order:3;flex-basis:100%}}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;margin:6px 0}
.acts .btn{text-align:left}
.prog{margin:8px 0}
.prog .bar{height:10px}
.log{font-size:12.5px;color:var(--m);max-height:260px;overflow:auto}
.log div{padding:2px 0;border-bottom:1px solid var(--b)}
.log div:first-child{color:var(--t)}
.place-d{color:var(--m);font-size:14px}
.lock{opacity:.6}
.bag{display:flex;flex-wrap:wrap;gap:6px}
.bag span{border:1px solid var(--b);padding:2px 8px;font-size:13px}
.empty{color:var(--m);font-size:13px;text-align:center;padding:10px 0}
.disp{border-top:1px solid var(--b);padding:6px 0;font-size:13px}
.ms{padding:6px 0;border-bottom:1px solid var(--b)}
.csk{margin:6px 0 0 10px}
.scw{position:relative;margin:-2px 0 10px;border:1px solid var(--b);overflow:hidden;aspect-ratio:3/1;background:var(--k6)}
.scs{display:block;width:100%;height:100%}
.k0{fill:var(--k0)}.k1{fill:var(--k1)}.k2{fill:var(--k2)}.k3{fill:var(--k3)}.k4{fill:var(--k4)}.k5{fill:var(--k5)}.k6{fill:var(--k6)}.k7{fill:var(--k7)}.kw{fill:var(--kw)}.sft{opacity:.55}.lit{opacity:.9}
.scs .moon{fill:var(--k7)}.scs .moonh{fill:var(--k7);opacity:.25}
.av{display:inline-flex;width:34px;height:34px;flex:none;border:1px solid var(--b);border-radius:2px;background:var(--c2);align-items:center;justify-content:center;overflow:hidden;vertical-align:middle}
.av svg{width:24px;height:24px}img.av{object-fit:cover;padding:0}
.avs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.avs .btn{padding:2px}.avs .btn.on .av{border-color:var(--a);box-shadow:0 0 0 1px var(--a)}
.nmrow{display:flex;align-items:center;gap:10px}.nmrow input{flex:1}.csk.off b{opacity:.55}
.ms.done{color:var(--m)}
.ms.now b{color:var(--a)}

/* ===== 지도 ===== */
.mapw{position:relative;overflow:hidden;touch-action:none;cursor:grab;border:1px solid var(--b);background:var(--g);margin-top:4px;user-select:none;-webkit-user-select:none}
.mapw.drag{cursor:grabbing}
.mapc{position:absolute;top:6px;right:6px;display:flex;gap:4px;z-index:2}
.mapc .btn{min-height:32px;min-width:34px;padding:0 6px;font-size:14px;background:var(--c)}
.map{width:100%;height:auto;display:block;aspect-ratio:92/82;overflow:hidden}
.map .canal{fill:none;stroke:var(--b);stroke-width:3.2;opacity:.7}
.map .road{stroke:var(--a);stroke-width:.45;stroke-dasharray:1.6 1.6;opacity:.55}
.map .road.lk{opacity:.2}
.map .route{stroke:var(--kw);stroke-width:.8;stroke-dasharray:2 1.4;animation:rt 1.2s linear infinite}
@keyframes rt{to{stroke-dashoffset:-3.4}}
.map .node{cursor:pointer}
.map .node rect{fill:var(--c);stroke:var(--a);stroke-width:.5}
.map .node:hover rect,.map .node:focus rect{fill:var(--c2);stroke-width:.8}
.map .node.here rect{fill:var(--a)}
.map .node.dest rect{stroke:var(--kw);stroke-width:.9}
.map .node.lk{opacity:.4}
.map .node text{font:3.7px "Gowun Batang",serif;fill:var(--t);text-anchor:middle}
.map .node.here text{font-weight:700;fill:var(--a)}
.map .mk{fill:var(--kw);stroke:var(--c);stroke-width:.5}

/* ===== 만들기 화면 ===== */
.cr{max-width:720px;margin:0 auto}
.lead{text-align:center;max-width:560px;margin:4px auto;text-wrap:balance}
.cr .lead:not(.m){color:var(--t)}
.cr .card{margin-bottom:10px}
.tr-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}
.tr-list .btn{font-size:13px;min-height:36px}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;font-size:14px}
.stats .bar{margin:0}
.stats.st4{grid-template-columns:auto 1fr auto}
.stats.st4 .sne{grid-column:1/-1;margin:-2px 0 6px}
.stats .btn.sm{min-height:26px;padding:0 4px;margin-left:4px}

/* ===== 창 ===== */
.ovl{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;background:rgba(14,12,10,.72);overflow:auto;padding:24px 14px}
.ovl.on{display:flex}
#ov{z-index:40}#sov{z-index:60}#bt{z-index:30;background:var(--bg);display:none;padding:0}
#bt.on{display:block}
.pcard{position:relative;margin:auto;max-width:460px;width:100%;border:14px solid transparent;border-image:var(--pn) 12 fill / 14px stretch;padding:12px 16px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
.pcard.w{max-width:620px}
.pcard:before,.pcard:after{content:"";position:absolute;left:50%;width:9px;height:9px;background:var(--a);transform:translateX(-50%) rotate(45deg)}
.pcard:before{top:-19px}.pcard:after{bottom:-19px}
.pcard h2{text-align:center}
.btns{display:grid;gap:6px;margin-top:12px}
.btns.two{grid-template-columns:1fr 1fr}
.items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.items span{border:1px solid var(--al);padding:2px 8px;font-size:13px}
.set{display:grid;gap:12px;margin-top:6px}
.set label{display:block;font-size:13px;color:var(--m);margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--a)}

/* ===== 개발자 창 ===== */
#devb{position:fixed;left:10px;bottom:10px;z-index:75;opacity:.75}
#dov{z-index:95}
.dev h3{margin:10px 0 4px}
.dev .seg .btn{min-height:34px;font-size:12.5px}
#bdev{display:none;gap:4px}#bdev.on{display:inline-flex}

/* ===== 시작 연출 (1편 엔딩 슬라이드 방식) ===== */
#pv{display:none}#pv.on{display:block}
.eo{position:fixed;inset:0;z-index:80;background:#0b0a08;color:#d8ccb4;display:flex;align-items:center;justify-content:center;padding:30px 24px;cursor:pointer}
.ei{max-width:600px;text-align:center}
.el,.eh{text-wrap:balance}
.eh{font:800 15px "Nanum Myeongjo",serif;letter-spacing:.3em;color:#a8946c;margin-bottom:26px;opacity:0;animation:efi 1s forwards}
.el{font-size:17px;line-height:2;margin:10px 0;opacity:0;animation:efi 1.1s forwards}
.el .m{color:#8f846f;font-size:14px}
.ek{font:800 30px "Nanum Myeongjo",serif;letter-spacing:.25em;color:#c8b48a;margin:4px 0}
.esub{font-size:17px;letter-spacing:.5em;color:#a8946c}
.eo.now .el,.eo.now .eh,.eo.now .eb{animation-delay:0s!important;animation-duration:.25s}
.eb{opacity:0;animation:efi 1s forwards;margin-top:30px;color:#d8ccb4;border-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><polygon points='5.21,0.50 26.79,0.50 31.50,5.21 31.50,26.79 26.79,31.50 5.21,31.50 0.50,26.79 0.50,5.21' fill='none' stroke='%23a8946c' stroke-opacity='.8'/></svg>") 6 / 8px stretch}
.eb:hover,.eb:focus-visible{border-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><polygon points='5.21,0.50 26.79,0.50 31.50,5.21 31.50,26.79 26.79,31.50 5.21,31.50 0.50,26.79 0.50,5.21' fill='%23302a22' stroke='%23a8946c'/></svg>") 6 fill / 8px stretch}
.es{position:fixed;bottom:22px;left:0;right:0;text-align:center;font-size:12px;color:#6f6656}
.es span{text-decoration:underline;cursor:pointer}
.epn{position:fixed;top:18px;right:22px;font-size:12px;color:#5c5648}
@keyframes efi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== 전투 ===== */
.bwrap{max-width:560px;margin:0 auto;padding:14px 16px 28px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
.btop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btop .brand{font-size:14px;color:var(--m)}
.fn{display:flex;justify-content:center;align-items:baseline;gap:8px;font-size:19px;letter-spacing:.06em}
.fph{font-size:12px;color:var(--bad);font-family:"Gowun Batang",serif;font-weight:700}
.bbar{position:relative;height:8px;background:var(--gauge);border:1px solid var(--b);margin-top:5px}
.bbar i{position:absolute;left:0;top:0;bottom:0;background:var(--bad);transition:width .25s}
.bbar b{position:absolute;left:0;top:0;bottom:0;background:var(--kw);opacity:.55;transition:width .9s .35s}
.bbar.me i{background:var(--a)}
#btele{text-align:center;min-height:46px;color:var(--m);font-size:14px}
#btele .mv{color:var(--t);font-weight:700}
#btele .dm{letter-spacing:5px;color:var(--a);font-size:12px}
#btele .coach{color:var(--a);font-size:13px;margin-bottom:2px}#btele .coach b{color:var(--t)}
#barena{position:relative;width:min(84vw,320px);aspect-ratio:1;margin:0 auto 44px;touch-action:none}
#barena canvas{width:100%;height:100%;display:block}
#bjudge{position:absolute;left:-40px;right:-40px;top:calc(100% - 4px);text-align:center;font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:20px;letter-spacing:.08em;pointer-events:none;opacity:0}
#bjudge.on{animation:jd .7s ease-out forwards}
@keyframes jd{0%{opacity:0;transform:translateY(6px) scale(.9)}15%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
#bjudge.parry{color:var(--kw)}#bjudge.hit{color:var(--bad)}#bjudge.dodge{color:var(--t)}#bjudge.miss{color:var(--m)}
.shake{animation:sk .32s}
@keyframes sk{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
#bqte{text-align:center}
.track{position:relative;height:14px;background:var(--gauge);border:1px solid var(--b);margin:4px 8px}
#bqz{position:absolute;top:-1px;bottom:-1px;background:var(--al);border-left:1px solid var(--kw);border-right:1px solid var(--kw)}
#bqm{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1px;background:var(--t)}
.qh{font-size:12px;color:var(--m);margin-top:4px}
#bme .row{font-size:13px;color:var(--m)}
#bme .row b{color:var(--t);font-weight:400}
.pips{letter-spacing:3px;color:var(--a)}
.pips s{text-decoration:none;color:var(--b)}
#bacts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#bacts.def .btn{min-height:84px;font-size:18px}
#bacts .wide{grid-column:1/-1}
#blog{font-size:12.5px;color:var(--m);border-top:1px solid var(--b);padding-top:6px;min-height:72px}
#blog div{opacity:.55}#blog div:last-child{opacity:1;color:var(--t)}
#bov{z-index:35}
.phase{position:fixed;inset:0;background:#0b0a08;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:50;color:#d8ccb4;opacity:0;animation:ph 2.2s forwards;pointer-events:none}
.phase b{font:800 24px "Nanum Myeongjo",serif;letter-spacing:.2em}

const tln=(id,L)=>L.map(x=>(x=x.replace(/@N/g,esc(S.name)),x[0]==='*'?`<p class="m">${x.slice(1)}</p>`:x[0]==='!'?`<p>${esc(S.name)} — “${x.slice(1)}”</p>`:`<p>${cn(id)} — “${x}”</p>`)).join('');
// 줄을 차례로 보여 준다. > 줄에서 멈추고 그 말을 할지 고른다(말없이 들어도 이어진다). 끝나면 end(html)
function seq(id,title,L,end){const i=L.findIndex(x=>x[0]==='>');if(i<0){end(tln(id,L));return}
  const say=L[i].slice(1),rest=L.slice(i+1);ev(title,tln(id,L.slice(0,i)),[[say,()=>seq(id,title,['!'+say].concat(rest),end)],['말없이 듣는다',()=>seq(id,title,rest,end)]])}
const chNext=id=>{const L=CH[id];if(!L)return null;const n=(S.chd||{})[id]||0;return L[n]&&((S.aff||{})[id]||0)>=L[n].need?L[n]:null};

const affTier=id=>{const a=(S.aff||{})[id]||0;let t=1;AFT.forEach(([n],i)=>{if(a>=n)t=i+1});return t}; // 1~10
const affName=id=>(S.rom||'')===id?'마음':AFT[affTier(id)-1][1];
const romOK=id=>{const c=COMP[id];if(!c||!c.rom)return false;if(c.rom==='any')return true;return c.rom===S.sex}; // 지향이 맞는가
const romReady=id=>romOK(id)&&!S.rom&&((S.aff||{})[id]||0)>=70&&(!COMP[id].demi||(S.cq||{})[id]==='done'); // 고르는 장면이 열릴 수 있는가
function gainXp(n){const out=[`경험 +${n}`];S.xp+=n;
  while(S.xp>=xpNeed(S.lv)){S.xp-=xpNeed(S.lv);S.lv++;S.sp++;if(SKILL_LV.includes(S.lv)&&S.sk.length+S.skp<Object.keys(SKL).length)S.skp++;
    const m0=S.mhp;S.mhp=calcMhp(S.st,S.lv);S.hp=Math.min(S.mhp,S.hp+(S.mhp-m0));
    out.push(`<b class="g">레벨 ${S.lv}</b> — 능력치 점수 +1${S.skp?' · 새 기술을 배울 수 있다':''}. 캐릭터 탭에서 고른다.`);log('레벨 '+S.lv+'에 올랐다.')}
  return out}
function aff(id,n){S.aff=S.aff||{};const t0=affTier(id);S.aff[id]=Math.max(0,Math.min(100,(S.aff[id]||0)+n));const t1=affTier(id);if(t1>t0){S.tnew=S.tnew||{};S.tnew[id]=t1}}

 archive:()=>ev('대성당 뒤편',`<p>문서고 쪽에서 책 무더기가 쏟아지는 소리가 난다.</p><p>책장 사이에 붉은 구릿빛 비늘의 파볼릭이 서 있다. 두꺼운 장부를 품에 안았다. 그 앞을 회색 옷의 정화자가 막아선다.</p>
   <p>정화자 — “장부를 내려놓아라. 이름 없는 자.”</p><p>파볼릭 — “이름 없는 자라. 지운 건 당신들인데 말이지요.”</p>`,
   [['끼어든다',()=>{S.bstory='oswin';save();startBattle('fight','warden')}],['물러난다',null]]),
 oswinW:()=>ev('오스윈',`<p>파볼릭이 장부의 먼지를 턴다. 머리가 문틀에 닿을 듯하다.</p><p>오스윈 — “고맙다고 해야겠지요. 저는 오스윈입니다. 아니, 오스윈이었지요. 학술원 서류에는 이제 없는 이름이라서.”</p>`+
   (S.party==='kirien'?'<p>키리엔 — “말 많네.”</p><p>오스윈 — “칭찬으로 듣겠습니다.”</p>':''),[['장부에 뭐가 있느냐고 묻는다',()=>SCENE.osw2()]],1),
 osw2:()=>{jr('대성당 문서고에서 학술원에서 쫓겨난 칼라쉬의 후예 오스윈을 만났다. 그가 훔친 장부에는 푸른 재가 된 사람들의 이름이 적혀 있었다.');
   ev('오스윈',`<p>오스윈 — “학술원이 교단에 넘긴 명단이지요. 가스등에 쓸 푸른 재를 어디서 얻는지 아십니까.”</p>
   <p>오스윈 — “사람에게서 얻습니다. 기억을 태운 재지요. 이 장부에는 그 사람들 이름이 적혀 있습니다. 적혀 있었다고 해야 맞겠군요. 반은 지워졌으니.”</p>
   <p>오스윈 — “당신이 찾는 것도 여기 어딘가에 있을지 모릅니다. 저는 지워진 쪽을 찾고 있고요. 같이 다니는 편이 서로 덜 귀찮겠지요.”</p>`,
   [[joinL('oswin'),()=>{joinComp('oswin');aff('oswin',2);SCENE.joined('oswin','오스윈 — “그럼 짐을 싸지요. 장부는 제가 듭니다.”',S.comps.length>=2?'여관에 돌아가 쉴 곳을 의논해 보자.':'')}],
    ['각자 갈 길을 간다',()=>SCENE.oswNo()]])},
 oswNo:()=>{S.dec.oswin=1;
   ev('오스윈','<p>오스윈 — “현명하십니다. 저와 엮이면 대개 서류에서 이름이 사라지거든요.”</p><p>오스윈 — “생각이 바뀌면 이 문서고로 오십시오. 정화자들이 다시 올 때까지는 여기 숨어 있을 테니.”</p>',[['돌아선다',null]],1)},
 oswAgain:()=>ev('오스윈','<p>책장 사이에서 붉은 구릿빛 꼬리가 삐죽 나와 있다.</p><p>오스윈 — “또 뵙는군요. 정화자들이 저를 잊어 주질 않아서 여기 숨어 지냅니다.”</p>',
   [[joinL('oswin'),()=>{delete S.dec.oswin;joinComp('oswin');jr('대성당 문서고에서 오스윈을 다시 만났다. 이번엔 함께 다니기로 했다.');SCENE.joined('oswin','오스윈 — “마침 숨어 지내는 것도 지겨웠지요.”',S.comps.length>=2?'여관에 돌아가 쉴 곳을 의논해 보자.':'')}],['그냥 둔다',null]]),
 manorRumor:()=>{S.mr=1;jr('녹슨 닻 여관 주인에게서 노래가 들린다는 오르빌 저택 이야기를 들었다.');
   ev(LODGE,`<p>여관 주인이 셋을 번갈아 본다.</p><p>“방 하나에 셋은 무리야. 운하 따라 내려가면 오르빌 저택이 있어. 주인이 죽은 지 십 년이 넘었지.”</p>
   <p>“그런데 밤마다 노래가 들린대. 가사도 없이 이름 하나를 길게 늘여 부르는 소리가. 그것만 없으면 빈집이야.”</p><p>“그 집 사정은 가스등 거리 늙은 점등꾼 브리타가 잘 알 거야. 그 할멈은 이 도시가 어두웠던 때를 기억하거든.”</p>`,
   [['브리타를 찾아가 보기로 한다',null]],1)},
 brita:()=>ev('늙은 점등꾼 브리타',`<p>초소 맞은편 가스등 아래 허리가 굽은 노파가 장대를 짚고 서 있다.</p><p>브리타 — “오르빌 저택? 그 집 노래라면 나도 들었지. 사십 년 전 그 집 주인이 처음으로 푸른 재를 사들였어. 그땐 다들 박수를 쳤단다. 밤이 밝아진다고.”</p>
   <p>브리타 — “우리 할머니는 손끝으로 촛불을 켰어. 주문을 외면서. 나도 그 주문을 다 배웠지. 그런데 지금은 한 줄도 말이 안 돼. 배운 건 기억나는데 말은 하나도 안 나와.”</p>`,
   [['주문이 사라졌다는 거야?',()=>SCENE.brita2(0)],['오르빌은 누구를 불러?',()=>SCENE.brita2(1)]]),
 brita2:c=>{S.mr=2;jr('늙은 점등꾼 브리타를 만났다. 그녀는 할머니에게 배운 주문을 기억하지만 한 줄도 말로 꺼낼 수 없다고 했다. 오르빌 가문은 교단 묘지에 묻혔다.');
   ev('늙은 점등꾼 브리타',(c?'<p>브리타 — “몰라. 들으면 잊혀. 그 집 노래는 그래.”</p>':'<p>브리타 — “사라진 게 아니야. 어딘가 있는데 손이 안 닿는 느낌이지. 이 나이가 되면 그런 게 많아. 그런데 이건 나만 그런 게 아니더라고. 겨울 시대 노인들이 다 그래.”</p>')+
   '<p>브리타 — “오르빌 사람들은 교단 묘지 북쪽 끝에 묻혔어. 비석을 보면 뭔가 알지도 모르지.”</p>'+pline({kirien:'주문이 머릿속에 있는데 입으로 안 나온다고? 그거 무섭다.',oswin:'배운 건 남았는데 말이 사라졌다라. 학자로서는 흥미롭고 사람으로서는 무섭군요.'}),[['묘지로 가 보기로 한다',null]],1)},
 tomb:()=>{S.manor=1;jr('교단 묘지에서 오르빌 가문의 무덤을 찾았다. 비문은 정으로 긁혀 있었다. “겨울이 끝난 해 … 불을 거둔 이 … 여기 잠들지 않는다.” 무덤 문 틈에 저택 열쇠가 끼워져 있었다.');
   ev('오르빌 가문의 무덤',`<p>묘지 북쪽 끝. 이끼 낀 가족묘에 오르빌 상회의 닻 문장이 새겨져 있다. 비문 대부분이 정으로 긁혀 나갔다.</p><p class="m">남은 글자 — “겨울이 끝난 해 … 불을 거둔 이 … 여기 잠들지 않는다.”</p>`+
   (S.party==='oswin'?'<p class="m">오스윈의 꼬리 끝에서 불꽃이 튄다. 비석에 가까이 갈수록 세게.</p>':pline({kirien:'누가 일부러 긁었어. 이름을 지우려고. 교단 장부처럼.'}))+(S.party==='oswin'?'<p>오스윈 — “이 돌은 뭔가를 기억하는군요. 저보다 오래.”</p>':'')+
   `<p>무덤 문 틈에 녹슨 열쇠 하나가 끼워져 있다. 누가 두고 간 것처럼. 손잡이에 오르빌 저택의 문장이 있다.</p><p class="m">지도에 오르빌 저택이 나타났다.</p>`,[['열쇠를 챙긴다',null]],1)},
 manorIn:()=>ev('오르빌 저택',`<p>현관문은 잠겨 있지 않다. 안은 바깥보다 차갑다.</p><p>위층에서 노래가 들린다. 가사는 없다. 이름 하나를 길게 늘여 부르는 소리다.</p>`+
   pline({kirien:'노래 들려? 나만 들리는 거 아니지?',oswin:'재에 먹힌 사람은 마지막으로 붙든 걸 끝까지 놓지 않지요. 이 집 주인은 이름을 붙든 모양입니다.'}),
   [['위층으로 올라간다',()=>{S.bstory='manor';save();startBattle('fight','singer')}],['오늘은 돌아간다',null]]),
 manorW:()=>{S.base=1;S.manor=1;S.vis.base=1;const L=S.legacy;if(L&&RELIC[L.pa])S.inv.relic=1;
   log('오르빌 저택이 본거지가 되었다.');jr('오르빌 저택의 노래를 잠재웠다. 노래하던 이름은 알아듣지 못했다. 저택이 우리 본거지가 되었다.');
   ev('오르빌 저택',`<p>노래가 그쳤다. 낡은 옷 속에 푸른 재만 한 줌 남았다.</p><p>벽난로 위 초상화의 얼굴은 지워져 있다. 그 아래 놋쇠 판에는 이름 대신 긁힌 자국뿐이다.</p>
   <p>노래하던 이름은 끝내 알아듣지 못했다. 점등꾼이 중얼거리던 소리와 닮았던 것 같다.</p>`+
   pline({kirien:'유령 나온 집에서 살자고? …뭐, 여관비는 아끼겠네.',oswin:'서재가 있군요. 책은 다 젖었지만 말리면 됩니다. 대부분은요.'})+
   (L&&RELIC[L.pa]?`<p class="m">다락에서 낡은 물건 하나를 찾았다 — 「${RELIC[L.pa][0]}」. ${RELIC[L.pa][1]}</p>`:'')+
   `<p class="m">오르빌 저택이 본거지가 되었다. 화로에서 쉴 수 있다. 동료들은 여기서 지내고, 데리고 나갈 사람은 동료의 방에서 바꾼다.</p>`,
   [['짐을 옮긴다',null]],1)},
 eda:()=>ev('초소 앞의 아이',`<p>초소 담벼락 아래 열서너 살쯤 된 아이가 앉아 있다. 무릎 위에 꺼진 등잔 하나를 안았다.</p><p>키리엔 — “에다. 내 의뢰인이야. 그날 밤 그 점등꾼이 에다 아빠였어.”</p><p>에다 — “아빠는 죽었어요?”</p>`,
   [['살아 있을 거라고 말한다',()=>SCENE.eda2(1)],['모르겠다고 말한다',()=>SCENE.eda2(0)]]),
 eda2:c=>ev('에다',(c?'<p>에다가 등잔을 꼭 끌어안는다.</p>':'<p>에다가 고개를 숙인다. 등잔 유리에 얼굴이 비친다.</p>')+
   `<p>키리엔 — “그날 밤 쓰러진 너희 아빠를 회색 마차가 실어 갔어. 학술원 마차야. 죽은 사람은 안 싣고 가.”</p>
   <p>에다 — “아빠가 사라지기 전날 밤에 이상한 말을 했어요. 잠꼬대처럼.”</p><p>에다 — “‘${esc(S.name)}${josa(S.name,'이','가').slice(-1)} 돌아오면 언덕으로 보내라. 유리 지붕 아래로.’”</p>
   <p class="m">그것은 내 이름이다. 편지 말고도 이 도시에 내 이름을 아는 것이 있었다.</p><p>키리엔 — “…네 이름이잖아.”</p>`+
   (S.comps.includes('oswin')?'<p>오스윈 — “편지 다음은 유언이군요. 당신은 이 도시에서 인기가 많습니다. 좋은 쪽으로는 아닌 것 같지만.”</p>':''),
   [['아버지를 찾아 주겠다고 약속한다',()=>{S.eprom=1;aff('kirien',3);SCENE.eda3()}],['언덕에 가 보겠다고만 한다',()=>SCENE.eda3()]]),
 eda3:()=>{S.eda=1;S.acad=1;log('학술원 언덕으로 가는 길이 열렸다.');
   jr(`키리엔의 의뢰인 에다를 만났다. 점등꾼은 그 아이의 아버지였다. 그는 사라지기 전날 밤 내 이름을 말했다. “돌아오면 언덕으로 보내라. 유리 지붕 아래로.”`);
   ev('1막 — 꺼지지 않는 등불',(S.eprom?'<p>에다 — “약속했어요. 잊으면 안 돼요.”</p>':'<p>에다는 대답 대신 등잔을 내민다. 받지 않자 다시 끌어안는다.</p>')+
   `<p>키리엔 — “의뢰는 아직 안 끝났어. 언덕에 같이 가.”</p><p class="m">편지는 나를 이 도시로 불렀다. 등불을 든 사람은 내 이름을 알았다. 나는 아직 내가 무엇을 잊었는지 모른다.</p>
   <p><b class="g">1막 「꺼지지 않는 등불」이 끝났다.</b></p><p class="m">학술원 언덕으로 가는 길이 열렸다. 키리엔의 이야기 「등불을 든 사람」이 시작된다.</p>`,[['언덕을 올려다본다',null]],1)},
 kq1:()=>ev('하얀 요양소',`<p>언덕 끝의 하얀 건물. 창마다 쇠창살이 있다. 문지기가 장부를 펼친 채 졸고 있다.</p><p>키리엔이 장부를 슬쩍 돌려 본다. 손가락이 한 줄에서 멈춘다.</p><p class="m">“석 달 전 입소. 점등꾼 토벤. 분류: 공급 대기.”</p>
   <p>키리엔 — “공급 대기. 사람한테 쓰는 말이 아니잖아.”</p><p>키리엔 — “낮엔 못 들어가. 밤에 다시 오자. 문지기 말고 다른 게 지킨대.”</p>`,
   [['밤에 다시 오기로 한다',()=>{S.kq=1;jr('학술원 요양소 장부에서 토벤의 이름을 찾았다. 분류는 “공급 대기”였다.')}]],1),
 kq2:()=>ev('밤의 요양소',`<p>달이 가려진 밤. 요양소 뒷문의 자물쇠는 키리엔의 머리핀 하나에 열린다.</p><p>복도 안쪽에서 풀무가 숨 쉬는 소리가 들린다. 바닥에 푸른 재가 길게 끌린 자국이 있다.</p><p>키리엔 — “저 소리. 회색 마차 사람들이야.”</p>`,
   [['안으로 들어간다',()=>{S.bstory='kq2';save();startBattle('fight','collector')}],['오늘은 돌아간다',null]]),
 kq2W:()=>{S.kq=2;aff('kirien',3);jr('요양소 깊은 방에서 토벤을 찾았다. 그는 딸의 이름을 몰랐다. 내 이름만 알았다. 그를 업고 에다의 집으로 데려갔다.');
   ev('요양소 깊은 방',`<p>복도 끝 방. 침대 하나에 마른 남자가 누워 있다. 눈은 뜨고 있지만 아무것도 보지 않는다. 손에는 식은 심지 하나를 쥐었다.</p><p>키리엔 — “토벤 씨. 에다가 기다려요.”</p>
   <p>대답이 없다. 남자의 눈이 천천히 움직여 키리엔을 지나 나에게서 멈춘다.</p><p>토벤 — “…${esc(S.name)}.”</p>
   <p class="m">그는 그 말만 하고 다시 천장을 본다. 몇 번을 물어도 내 이름만 되풀이한다.</p><p>키리엔 — “너를 알아. 딸 이름은 몰라도 네 이름은 알아.”</p>
   <p>키리엔 — “일단 에다네 집으로 데려가자. 머릿속을 채울 방법은 그다음에 생각해. 가스등 거리 뒷골목에 기억 전당포가 있어. 거기선 기억을 사고판대.”</p>`,[['토벤을 업는다',null]],1)},
 kq3:()=>{const told=(S.chd||{}).kirien>=4;
   ev('기억 전당포',`<p>가스등 거리 뒷골목. 유리병이 천장까지 쌓인 가게. 병마다 푸른 안개가 고여 있고 꼬리표가 달렸다.</p><p>주인 노파가 돋보기 너머로 키리엔을 본다.</p>
   <p>오델 — “그 귀. 미라의 딸이로구나. 네 엄마가 여기 단골이었지. 사러 온 게 아니라 팔러.”</p>`+(told?'<p>키리엔 — “알아요.”</p><p class="m">키리엔이 내 쪽을 한 번 본다. 이미 들은 이야기다.</p>':'<p class="m">키리엔의 귀가 딱 굳는다. 아무 말도 하지 않는다.</p>')+
   `<p>오델 — “아비의 기억을 찾는다고? 남의 것이라도 괜찮다면 있지. 딸을 키운 사내의 기억 한 병. 이름은 다르지만 사랑하는 법은 같아. 동전 스물.”</p>`,
   [['산다 (동전 20)',()=>SCENE.kqBuy(1)],['사지 않는다',()=>SCENE.kqBuy(0)]])},
 kqBuy:b=>{const told=(S.chd||{}).kirien>=4;
   if(b&&S.coin<20){ev('기억 전당포','<p>동전이 모자라다.</p><p>오델 — “돈이 생기면 다시 와. 이 병은 잘 안 팔려. 다들 제 아비 기억을 원하지 남의 아비는 원하지 않거든.”</p>',[['돌아선다',null]],1);if(S.kq===2){S.kq=3;jr('기억 전당포에서 키리엔의 엄마가 기억을 팔았다는 것을 알았다.')}return}
   if(b){S.coin-=20;add('mem',1);log('남의 아버지의 기억을 샀다.')}
   if(S.kq===2){S.kq=3;jr('기억 전당포에서 키리엔의 엄마가 기억을 팔았다는 것을 알았다.'+(b?' 딸을 키운 낯선 사내의 기억 한 병을 샀다.':''))}
   ev('기억 전당포',(b?'<p>오델이 병을 천으로 싸서 건넨다. 생각보다 가볍다.</p>':'<p>오델 — “마음이 바뀌면 와. 병은 기다려 주니까.”</p>')+
   (told?'<p>키리엔 — “엄마 기억도 저 병들 중에 있을까. …찾으면 안 될 것 같아. 찾으면 사고 싶어질 테니까.”</p>':'<p>밖으로 나오자 키리엔이 짧게 말한다.</p><p>키리엔 — “엄마 얘기는 나중에 할게. 지금은 토벤 씨가 먼저야.”</p>')+
   '<p class="m">에다의 집에서 토벤을 어떻게 할지 정하자.</p>',[['고개를 끄덕인다',null]],1)},
 kq4:()=>ev('에다의 집',`<p>가스등 거리 끝 다락방. 토벤은 창가 의자에 앉아 꺼진 등잔을 만지작거린다. 에다가 그 옆에 쪼그려 앉아 있다.</p>
   <p>에다 — “아빠가 저를 몰라요. 그래도 등잔은 알아요. 매일 밤 심지를 갈아요. 불도 안 켜면서.”</p><p>키리엔 — “어떻게 할지는 에다가 정해야 해. 근데 에다는 네 말을 듣고 싶대.”</p>`+
   (S.inv.mem?'':'<p class="m">남의 기억을 부어 주려면 기억 전당포에서 병을 사 와야 한다.</p>'),
   (S.inv.mem?[['남의 기억을 부어 준다',()=>SCENE.kqEnd('pour')]]:[]).concat([['빈 채로 처음부터 알아 가게 한다',()=>SCENE.kqEnd('new')],['교단 구호소에 맡겨 쉬게 한다',()=>SCENE.kqEnd('rest')],['아직 정하지 못했다',null]])),
 kqEnd:k=>{S.kq=4;S.kqe=k;S.cq.kirien='done';
   const E={pour:[3,'<p>병마개를 열자 푸른 안개가 토벤의 숨으로 스민다. 토벤이 눈을 깜박인다. 그리고 에다를 본다.</p><p>토벤 — “…리나야. 밥은 먹었니.”</p><p>에다는 한참 대답하지 않는다. 그러다 고개를 끄덕인다.</p><p>에다 — “응. 먹었어, 아빠.”</p><p>키리엔 — “다른 이름으로 불러도 아빠가 웃잖아. 그거면 된 거겠지. …된 거겠지?”</p>','토벤에게 낯선 사내의 기억을 부어 주었다. 그는 에다를 다른 이름으로 부르며 웃었다.'],
     new:[6,'<p>에다가 토벤의 손을 잡는다.</p><p>에다 — “아빠. 나는 에다야. 아빠 딸이야. 오늘부터 하나씩 다시 알려 줄게.”</p><p>토벤이 그 손을 오래 내려다본다. 그리고 아주 작게 따라 말한다.</p><p>토벤 — “…에다.”</p><p>키리엔 — “처음부터라. 엄마한테도 그렇게 해 볼걸 그랬나.”</p>','토벤은 빈 채로 집에 돌아갔다. 에다가 처음부터 하나씩 알려 주기로 했다. 그는 딸의 이름을 처음으로 따라 말했다.'],
     rest:[2,'<p>교단 구호소의 수녀가 토벤의 어깨에 담요를 덮는다. 에다는 등잔을 품에 안고 오래 서 있다.</p><p>에다 — “아빠가 이 등잔을 켜던 거 기억해요. 내가 기억하면 돼요.”</p><p>키리엔 — “…그래. 기억하는 사람이 하나는 있어야지.”</p>','토벤을 교단 구호소에 맡겼다. 에다는 아버지 대신 등잔을 기억하기로 했다.']}[k];
   if(k==='pour')add('mem',-1);aff('kirien',E[0]);S.outs=1;jr(E[2]);log('키리엔의 이야기 「등불을 든 사람」을 마쳤다.');
   ev('등불을 든 사람',E[1]+`<p>돌아가는 길에 키리엔이 말한다.</p><p>키리엔 — “그 사람 네 이름을 알았어. 딸 이름보다 먼저. 나 그거 안 잊을 거야. 언젠가 이유를 알아내자.”</p><p class="m">키리엔의 이야기 「등불을 든 사람」이 끝났다.</p><p>키리엔 — “변두리에 가 볼래? 우리 엄마가 거기 살아. …만나자는 건 아니고.”</p><p class="m">지도에 변두리가 열렸다.</p>`,[['고개를 끄덕인다',null]],1)},
 pqask:()=>{S.pq=2;S.outs=1;log('변두리로 가는 길이 열렸다.');jr('부두 짐꾼에게서 피트가 넝마 시장 수레에 실려 갔다는 말을 들었다. 변두리로 가는 길이 열렸다.');
   ev('부두 짐꾼',`<p>짐꾼 — “그 꼬마? 성벽 밖에서 넝마 시장 사람들이 수레에 태워 가던데. 잠든 애들을 자루처럼 쌓아서.”</p><p>짐꾼 — “변두리에선 애들 꿈을 산대. 싸게. 애들 꿈은 금방 다시 자라니까 괜찮다나.”</p>`+pline({kirien:'다시 자란다고? 누가 그래. 사는 쪽이 그러겠지.',oswin:'아이들 기억은 재가 곱다고 학술원 보고서에 적혀 있었지요. 제가 읽은 가장 역겨운 문장입니다.'})+'<p class="m">지도에 변두리가 열렸다.</p>',[['변두리로 간다',null]],1)},
 pqtent:()=>ev('넝마 시장 뒷천막',`<p>천막 안에 철창이 줄지어 있다. 아이들이 잠들어 있다. 손끝이 하나같이 파랗다.</p><p>철창 사이를 가면 쓴 사람이 오간다. 가면 아래로 깔때기가 늘어져 있다. 잠든 아이 입가에 깔때기를 대고 숨을 들이켠다.</p><p>구석 철창에서 피트의 갈고리가 보인다.</p>`,
   [['철창으로 다가간다',()=>{S.bstory='pq';save();startBattle('fight','ashman')}],['일단 물러난다',null]]),
 pqW:()=>ev('넝마 시장 뒷천막',`<p>철창을 열자 피트가 눈을 뜬다. 한참 이쪽을 본다.</p><p>피트 — “…나 누구였더라?”</p>`,
   [['피트. 하수구에서 노래하던 아이',()=>SCENE.pqW2()],['우리 저택 심부름꾼 피트',()=>SCENE.pqW2()]]),
 pqW2:()=>{S.pq=3;if(S.kids&&S.kids.pit)S.kids.pit.st='hurt';jr('넝마 시장 뒷천막에서 피트를 구했다. 피트는 제 이름을 잠깐 잊었다가 되찾았다. 다른 아이들 몇은 끝내 제 이름을 대지 못했다.');log('피트를 구했다.');
   ev('피트',`<p>피트가 입술을 달싹인다.</p><p>피트 — “…맞아. 피트. 성은 몰라.”</p><p class="m">다른 철창의 아이들도 풀어 주었다. 몇은 집이 어딘지 기억했다. 몇은 제 이름을 대지 못했다. 그 아이들은 교단 구호소로 보냈다.</p>`+pline({kirien:'이름을 못 대는 애들. 나중에 내가 찾아 줄게. 그게 내 일이니까.',oswin:'이름을 잃은 아이들이라. 장부에 한 줄씩 적어 두겠습니다. 언젠가 돌려줄 수 있게.'})+'<p class="m">피트는 지쳐 있다. 저택 아이들 방에서 돌봐 줘야 한다.</p>',[['피트를 업는다',null]],1)},
 hag:()=>{const h=S.hq||0;
   if(h===0)ev('주문을 외는 노인',`<p>천막 앞에 늙은 잉그라드가 앉아 있다. 부엉이 머리의 깃털이 다 셌다. 손을 들어 낯선 말을 중얼거린다. 아무 일도 일어나지 않는다.</p><p>하그 — “젊을 땐 이 말로 불을 켰어. 지금은 그냥 말이야. 그런데 이상하지. 말은 하나도 안 잊었어.”</p><p>하그 — “내 주문책을 넝마 시장 녀석들이 훔쳐 갔어. 천막 사이 어딘가에 굴러다닐 거야. 찾아 주면 사례하지.”</p>`,[['찾아 주겠다고 한다',()=>{S.hq=1;jr('변두리에서 주문을 외는 노인 하그를 만났다. 주문책을 찾아 달라고 했다.');save()}],['그냥 지나간다',null]]);
   else if(h===2)ev('주문을 외는 노인',`<p>하그가 주문책을 받아 펼친다. 손이 떨린다. 주문이 적혀 있던 자리마다 종이가 하얗다. 여백의 낙서와 장보기 목록만 남았다.</p><p>하그 — “잉크가 바랜 게 아니야. 이 책은 겨울이 끝나고 스무 해쯤 지나서 하얘졌어. 하룻밤에. 세상 모든 주문책이 그날 밤 하얘졌지.”</p><p>하그가 제 머리를 손가락으로 두드린다.</p><p>하그 — “그런데 주문은 여기 남아 있어. 종이에서 사라진 게 머릿속에는 남았다니. 그럼 마법은 어디로 간 걸까.”</p>`+
     pline({kirien:'머릿속이라. 그럼 그게 재가 되면…. 아니야. 아무것도.',oswin:'…기억 속으로요. 아니, 근거 없는 말입니다. 잊어 주십시오.'}),
     [['책을 돌려준다',()=>SCENE.hagEnd(0)],['학술원에 알리자고 한다',()=>SCENE.hagEnd(1)]]);
   else ev('주문을 외는 노인','<p>하그가 고개를 든다.</p><p>하그 — “책은 찾았나? 넝마 시장 녀석들은 천막 사이에 뭐든 버려.”</p>',[['고개를 끄덕인다',null]],1)},
 hagEnd:c=>{S.hq=3;add('grim',-1);const n=['<p>하그 — “'+(c?'학술원? 그 녀석들이 이런 걸 왜 모으는지 알고 하는 말이야? 겨울 시대 노인들 꿈을 사 가는 놈들이야. 안 돼.':'고맙네. 하얀 종이라도 내 책이야. 내가 기억하는 동안은.')+'”</p>','<p class="m">하그가 낡은 부적 하나와 동전을 쥐여 준다. 부적에서 아주 희미하게 따뜻한 기운이 느껴진다. 착각일지도 모른다.</p>'];
   S.coin+=10;jr('하그에게 주문책을 돌려주었다. 세상의 주문책은 겨울이 끝나고 스무 해 뒤 하룻밤에 하얘졌다고 한다. 주문은 사람들 머릿속에만 남았다.');
   ev('주문을 외는 노인',n.join(''),[['고개를 숙인다',null]],1);const X=gainXp(20);if(X.length>1)setTimeout(()=>pop('하그의 사례',{n:X}),0)},
 sewer:()=>ev('하수구 입구',`<p>하수구 철창 너머에서 아이 비명이 들린다. 쥐 떼 우는 소리가 벽을 타고 번진다.</p>`,
   [['철창을 비틀어 연다',()=>{S.bstory='pit';save();startBattle('fight','rats')}],['못 들은 척한다',null]]),
 pitW:()=>ev('피트',`<p>철창 안쪽에서 흙투성이 아이가 기어 나온다. 열 살쯤 되어 보인다. 손에 녹슨 갈고리를 꼭 쥐었다.</p><p>아이 — “…쥐 떼보다 무서운 사람은 아니지?”</p>`,
   [['이름이 뭐야?',()=>SCENE.pit2(0)],['다친 데는 없어?',()=>SCENE.pit2(1)]]),
 pit2:c=>ev('피트',(c?'<p>아이가 무릎을 내려다본다. 피가 말라붙어 있다.</p><p>아이 — “이 정도는 맨날 나. 안 아파. …조금 아파.”</p><p>아이 — “피트야. 성은 몰라.”</p>':'<p>아이 — “피트. 성은 몰라. 성이 있었으면 하수구에 안 살았겠지.”</p>')+
   '<p>피트 — “여기서 쓸 만한 거 주워다 팔아. 근데 요즘 쥐가 너무 많아.”</p>',[['왜 하수구에서 살아?',()=>SCENE.pit3(0)],['배고프지 않아?',()=>SCENE.pit3(1)]]),
 pit3:c=>ev('피트',(c?'<p>피트의 배에서 대답 대신 꼬르륵 소리가 난다. 피트가 얼굴을 붉힌다.</p>':'<p>피트 — “위는 가스등이 너무 밝아. 오래 있으면 머리가 멍해져. 여긴 어두워서 괜찮아.”</p>')+
   '<p>피트 — “…근데 너네 집 있어? 진짜 집? 지붕 있는 거?”</p>'+pline({kirien:'유령 나오던 집이지만 지붕은 있어. 반쯤.',oswin:'지붕은 있습니다. 비가 새는 지붕이지만요. 철학적으로는 지붕이지요.'}),
   [['저택에서 같이 지내자',()=>SCENE.pitJoin()],['심부름을 해 주면 밥을 주겠다',()=>SCENE.pitJoin()]]),
 pitJoin:()=>{S.pit=1;S.kids=S.kids||{};S.kids.pit=S.kids.pit||{st:'ok'};log('피트가 저택에서 지내게 되었다.');jr('하수구에서 쥐 떼에 쫓기던 아이 피트를 구했다. 저택에서 심부름을 하며 지내기로 했다.');
   ev('피트',`<p>피트 — “진짜? 뭐든 할게. 밥만 주면.”</p>`+pline({kirien:'밥은 네가 해. 나는 못 해.',oswin:'글은 읽을 줄 압니까? 아니라면 가르치지요. 심부름꾼이 장부를 못 읽으면 곤란하니까.'})+
   `<p class="m">피트가 저택에서 지내게 되었다. 본거지에서 파견을 맡길 수 있다.</p>`,[['데려간다',null]],1)}
};

  if(S.v<3){if(S.loc==='inn')S.loc='base';S.vis=S.vis||{};if(S.vis.inn){S.vis.base=1;delete S.vis.inn}S.pit=S.base?1:0;S.v=3} // v2: 본거지 id가 inn이었다
  if(S.v<4){S.v=4} // v3: 성별·호감도 없음 → 기본값(아래에서 채운다)
  S.inv=S.inv||{};S.disp=S.disp||[];S.vis=S.vis||{inn:1};S.log=S.log||[];S.jr=S.jr||[];

  S.comps=S.comps||[];if(S.party===undefined)S.party=null;S.aff=S.aff||{};S.cq=S.cq||{};S.talked=S.talked||{};S.dec=S.dec||{};if(S.rom===undefined)S.rom=null;
  if(!S.sex)S.sex='x';S.comps=S.comps.filter(c=>COMP[c]);if(S.party&&!COMP[S.party])S.party=S.comps[0]||null;
  if(!ORIGIN[S.og])S.og=0;if(!S.letter0){S.letter0=1;if(!S.inv.letter)S.inv.letter=1}if(!PL[S.loc]||(PL[S.loc].hide&&PL[S.loc].hide(S)))S.loc='docks';
  S.lv=S.lv||1;S.xp=S.xp||0;S.sp=S.sp||0;S.skp=S.skp||0;S.sk=(S.sk||[]).filter(k=>SKL[k]);if(!S.sk.length)S.sk=[OSK[S.og]||'stance'];if(S.v<5)S.v=5;
  S.fix=S.fix||{};S.deco=Object.assign({},DECO0,S.deco||{});Object.keys(DECO).forEach(sl=>{if(decoO(sl,S.deco[sl])[0]!==S.deco[sl])S.deco[sl]=DECO0[sl]});S.own=S.own||{};S.read=S.read||{};if(S.v<6)S.v=6;
  S.chd=S.chd||{};S.kq=S.kq||0;if(S.v<7)S.v=7;
  S.asked=S.asked||{};S.tnew=S.tnew||{};S.cl=S.cl||{};S.comps.forEach(cst);if(S.v<8)S.v=8;
  if(!S.av)S.av='i0';if(S.manor&&!S.mr)S.mr=3;S.kids=S.kids||{};if(S.pit&&!S.kids.pit)S.kids.pit={st:S.disp.length?'out':'ok'};S.disp.forEach(d=>{if(!d.kid)d.kid='pit'});if(S.v<9)S.v=9; // v9: 아이들·먼 파견·간호 // v8: 호감 10단계, 질문 대화, 동료 전투 // v7: 동료 자기 이야기, 키리엔 퀘스트 // v6: 저택 손보기·꾸미기
  S.mhp=calcMhp(S.st,S.lv);S.hp=Math.min(S.mhp,Math.max(0,S.hp|0));
}

/* ===================== 저장 정화 (1편 scs/scrub) ===================== */
const WTAG=/<\/?(?:b|i|em|strong|br|p|span)(?: class=(?:'[\w -]*'|"[\w -]*"|[\w-]+))?\s*\/?>/gi,sesc=t=>t.replace(/[<>]/g,'').replace(/['"`\\]/g,'’');
function scs(x){let o='',i=0;x.replace(WTAG,(m,off)=>{o+=sesc(x.slice(i,off))+m;i=off+m.length;return m});return o+sesc(x.slice(i))}
function scrub(v,d){d=d||0;if(d>40)return null;if(typeof v=='string')return scs(v);if(Array.isArray(v))return v.map(x=>scrub(x,d+1));if(v&&typeof v=='object'){const o={};for(const k of Object.keys(v)){if(!/^[\w:.\-]{1,64}$/.test(k)||k=='__proto__'||k=='constructor'||k=='prototype')continue;o[k]=scrub(v[k],d+1)}return o}return typeof v=='number'?(isFinite(v)?v:0):typeof v=='boolean'||v===null?v:null}

async function cinit(){
  if(!DBH||!UID){CL.st='na';return}
  try{
    CL.ref=DBH.collection('data/users/'+UID).doc('save');
    const d=await CL.ref.get(),c=d.exists?d.data():null;CL.st='on';
    if(c&&typeof c.j=='string'){
      CL.cloud={t:c.t||0,j:c.j,s:c.s||'',dv:c.dv||''};
      if(!S){cpull();return}
      if(c.t>(S.sv||0)+2000&&c.j!==JSON.stringify(S))askCloud(1);else CL.dirty=1;

async function cflush(force){
  if(CL.st!='on'||CL.busy||CL.ask||!S||!CL.dirty)return;
  if(!force&&Date.now()-CL.last<20000)return;
  CL.busy=1;CL.dirty=0;
  try{const j=JSON.stringify(S),t=S.sv||Date.now();await CL.ref.set({t,j,s:fstate(),dv:CL.dv,v:VER});CL.last=Date.now();CL.cloud={t,j,s:fstate(),dv:CL.dv}}
  catch(e){const k=e&&e.code;if(k=='invalid_argument')CL.st='ro';else{CL.dirty=1;CL.last=Date.now()}}
  CL.busy=0;
}

/* 기록 코드: 압축한 저장을 글자로. 2편은 KS2, 1편은 KS0/KS1 */
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
async function gz(raw){return new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer())}
async function gunz(bin){return new Uint8Array(await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())}
async function scode(){const raw=new TextEncoder().encode(JSON.stringify(S));try{return 'KS2.'+b64(await gz(raw))}catch(e){return 'KS2r.'+b64(raw)}}
async function rawDecode(c){
  c=String(c||'').replace(/\s+/g,'');const m=/^KS(0|1|2|2r)\.(.+)$/.exec(c);if(!m)throw 0;
  const bin=Uint8Array.from(atob(m[2]),x=>x.charCodeAt(0));
  const raw=(m[1]=='1'||m[1]=='2')?await gunz(bin):bin;
  return {ver:m[1][0],o:scrub(JSON.parse(new TextDecoder().decode(raw)))};
}
async function sdecode(c){const {ver,o}=await rawDecode(c);if(ver!=='2'||!o||!RACE[o.race]||!o.inv)throw 0;return o}
// 1편 기록에서 필요한 것만 읽는다: 이름·종족·출신·계통·엔딩·데리고 다닌 동료
async function legacyDecode(c){
  const {ver,o}=await rawDecode(c);if(ver==='2'||!o||!RACE1[o.race])throw 0;
  const str=x=>typeof x=='string'?x.replace(/<[^>]*>/g,'').slice(0,24):'';
  return {name:str(o.name)||'이름 없는 여행자',race:o.race,og:str(o.og),tr:str(o.tr),end:END1[o.end]?o.end:'',pa:RELIC[o.pa]?o.pa:''};
}

/* ===================== 화면 그리기 (1편 morph) ===================== */
function morph(P,h){const T=document.createElement('template');T.innerHTML=h;msync(P,T.content)}
function msync(o,n){const oc=[...o.childNodes],nc=[...n.childNodes];nc.forEach((b,i)=>{const a=oc[i];if(!a){o.appendChild(b);return}if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName||(a.nodeType==1&&a.id!==b.id)){o.replaceChild(b,a);return}if(a.nodeType!=1){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}if(a.isEqualNode(b))return;mattr(a,b);msync(a,b)});for(let i=oc.length-1;i>=nc.length;i--)o.removeChild(oc[i])}
function mattr(a,b){for(const x of [...a.attributes])if(!b.hasAttribute(x.name))a.removeAttribute(x.name);for(const x of b.attributes)if(a.getAttribute(x.name)!==x.value)a.setAttribute(x.name,x.value);if((a.nodeName=='INPUT'||a.nodeName=='TEXTAREA')&&a!==document.activeElement&&a.type!='file'&&a.value!==(b.getAttribute('value')||''))a.value=b.getAttribute('value')||'';if(a.nodeName=='DETAILS')a.open=b.hasAttribute('open')}

/* 도시 지도 (1편처럼 점과 길). 확대·이동은 viewBox로: 버튼, 휠, 끌기, 두 손가락 */

function mcenter(){const [x,y]=mapPos();if(MW.w>=MB.w)MW.w=MB.w/1.8;MW.h=MW.w*MB.h/MB.w;MW.x=x-MW.w/2;MW.y=y-MW.h/2;mclamp();mapply()}
function m2svg(cx,cy){const r=$('#mapw').getBoundingClientRect();return [MW.x+(cx-r.left)/r.width*MW.w,MW.y+(cy-r.top)/r.height*MW.h,r]}
const MPT=new Map();let MD=null;
document.addEventListener('pointerdown',e=>{const w=e.target.closest('#mapw');if(!w||e.target.closest('.mapc'))return;

function resolveDisp(){

function press(kind,ts){
  ac();
  if(G.st==='qte'){qteHit(ts);return}
  if(G.st!=='enemy'||CFG.auto||kind==='qte')return;
  if(ts<G.lock)return;
  const t=ts+CFG.lat,w=BW();let best=null,bo=1e9;
  for(const b of G.beats)if(!b.res){const o=t-b.T;if(Math.abs(o)<Math.abs(bo)){bo=o;best=b}}
  const ab=Math.abs(bo);
  if(kind==='dodge'){if(best&&ab<=w.d)return resolveBeat(best,'dodge',bo);if(best&&bo<0&&ab<=w.g)return resolveBeat(best,'graze',bo)}
  else if(best&&ab<=w.d)return ab<=w.p?resolveBeat(best,'parry',bo):resolveBeat(best,'hit',bo,'빗나간 받아침');
  G.lock=ts+250;G.S.whiff++;SND.whiff();bjudge('헛손','miss',best?bo:null);
}
function bloop(){
  if(!G.on)return;
  const t=now();
  if(G.st==='enemy'){const w=BW();for(const b of G.beats){if(b.res)continue;if(!b.warned&&t>=b.T-b.a){b.warned=true;SND.warn()}if(CFG.auto&&t>=b.T)resolveBeat(b,'dodge',null);else if(t+CFG.lat>b.T+w.d)resolveBeat(b,'hit',null,'맞음')}}
  if(G.st==='qte'&&G.q&&!G.q.done){const p=(t-G.q.t0)/G.q.dur;$('#bqm').style.left=Math.max(0,Math.min(1,p))*100+'%';if(p>1.08)resolveQte(false)}
  draw();requestAnimationFrame(bloop);
}
/* 설정 창이 열리면 멈춘다 */
function bpause(){G.paused=null;if(G.st==='enemy'||G.st==='qte'){G.paused=G.st;G.beats=[];if(G.st==='qte'){G.q.done=true;if(G.q.kind==='heavy')G.fp+=2}G.st='wait';brender();blog('잠시 멈춤. 닫으면 이번 동작을 다시 시작한다.')}}
function bresume(){const f=G.paused;G.paused=null;if(f==='enemy'){G.next=G.cur;setTimeout(enemyTurn,400)}else if(f==='qte'){G.st='player';brender()}}
/* 가르침 */
function tutStep(){const s=TS[G.tut];G.tg=0;G.next=null;G.st='wait';brender();bov(`<h2>가르침 ${G.tut+1} / ${TS.length}</h2><p>모르텐 — “${s.say}”</p><p class="m">${s.key}</p>${bbtns([['tgo','해 보지',1]])}`)}
function tutGo(){bovClose();const s=TS[G.tut];if(s.mv){G.next=s.mv;brender();setTimeout(enemyTurn,500)}else{G.turn=0;playerTurn()}}
function tutCheck(){const s=TS[G.tut];if(G.tg<s.need)return false;G.st='wait';G.next=null;brender();
  setTimeout(()=>{if(!G.on)return;if(G.tut===TS.length-1)endBattle('tut');else bov(`<p>모르텐 — “${s.ok}”</p>${bbtns([['tnext','다음',1]])}`)},500);return true}
/* 끝: 결과를 S에 반영하고 전투 화면을 닫는다 */
function statLine(){const S2=G.S;return `회피 ${S2.dodge} · 받아침 ${S2.parry}${S2.full?' · 완전한 받아침 '+S2.full:''} · 스침 ${S2.graze} · 맞음 ${S2.hit}`}
function endBattle(res){
  if(!G.on)return;
  const kind=G.kind,F=bfoe(),line=statLine();
  G.on=false;G.beats=[];bovClose();$('#bt').classList.remove('on');
  if(kind==='fight'){
    S.hp=Math.max(0,G.hp);S.inv.band=G.band;if(!S.inv.band)delete S.inv.band;
    const XL=S.xl;S.xl=null;const BS=S.bstory;S.bstory=null;if(res==='win'&&BS)S.pend=BS+'W';
    if(res==='win'){
      const L=F.loot();if(XL){Object.entries(XL.i).forEach(([k,n])=>L.i[k]=(L.i[k]||0)+n);L.g+=XL.g}Object.entries(L.i).forEach(([k,n])=>add(k,n));S.coin+=L.g;
      const story=NIGHT[S.night]===G.foe;if(story)S.night++;
      log(F.n+'을(를) 물리쳤다.');const XPL=gainXp(F.xp||5).concat(compXp(F.xp||5));
      if(story&&G.foe==='lamp'){S.pend='kirien';jr('편지가 가리킨 사람을 쓰러뜨렸다. 꺼지지 않는 등불이 돌바닥을 굴렀다. 그 사람이 중얼거린 이름은 끝내 알아듣지 못했다. 잊은 것은 아직 찾지 못했다. 교단 구역으로 가는 길이 열렸다.');S.hp=Math.max(S.hp,1)}
      else if(story)jr(F.win);
      pop('물리쳤다 — '+F.n,{i:L.i,g:L.g,n:(XL?[XL.t+' 중에 맞닥뜨렸다.']:[]).concat([F.win,`<span class="m">${line}</span>`]).concat(XPL).concat(story&&G.foe==='lamp'?['<b class="g">첫 번째 밤이 끝났다.</b>']:[])});
    }else{
      S.hp=Math.ceil(S.mhp*.3);S.loc=S.base?'base':'docks';S.act=null;log(F.n+' 앞에서 쓰러졌다.');
      pop('쓰러졌다',{n:[F.n+' 앞에서 돌바닥이 차가웠다.',(S.base?'눈을 뜨니 본거지 화로 앞이다.':`눈을 뜨니 ${LODGE} 방이다.`)+' 누군가 끌고 와 준 모양이다. 체력이 조금 돌아왔다.',`<span class="m">${line}</span>`]});
    }
  }else if(kind==='tut'){S.tutd=1;log('모르텐에게 싸우는 법을 배웠다.');pop('가르침을 마쳤다',{n:['모르텐 — “밤길은 갈수록 험해지네. 처음엔 굶은 개고 그다음엔 사람이지. 그다음은… 가 보면 알겠지.”']})}
  else pop('연습 기록',{n:[`<span class="m">${line}</span>`]});
  save();render();
}
/* 전투 입력 */
$('#bt').addEventListener('click',e=>{const b=e.target.closest('[data-ba]');if(b&&!b.disabled){bact(b.dataset.ba,b.dataset.k);b.blur()}});
$('#bov').addEventListener('click',e=>{const b=e.target.closest('[data-bo]');if(!b)return;const o=b.dataset.bo;
  if(o==='fgo'){bovClose();blog(bfoe().intro);playerTurn()}if(o==='tgo')tutGo();if(o==='tnext'){G.tut++;tutStep()}});
$('#bset').addEventListener('click',e=>{e.currentTarget.blur();settings()});
$('#bstop').addEventListener('click',e=>{e.currentTarget.blur();if(!G.on)return;if(G.kind==='practice')endBattle('practice');else if(G.kind==='tut')endBattle('tut')});
document.addEventListener('pointerdown',e=>{
  if(!G.on)return;
  const b=e.target.closest('[data-p]');
  if(b){e.preventDefault();press(b.dataset.p,e.timeStamp||now());return}
  if(G.st==='qte'&&e.target.closest('#barena,#bqte')){e.preventDefault();press('qte',e.timeStamp||now())}
},{passive:false});
document.addEventListener('keydown',e=>{
  if(!G.on||$('#sov').classList.contains('on')||$('#bov').classList.contains('on'))return;
  const k=e.key.toLowerCase(),ts=e.timeStamp||now();
  if(e.repeat){if(G.st==='enemy'||G.st==='qte')e.preventDefault();return}
  if(G.st==='qte'&&(k===' '||k==='f'||k==='j'||k==='enter')){e.preventDefault();press('qte',ts);return}
  if(G.st==='enemy'){if(k===' '||k==='f'){e.preventDefault();press('dodge',ts)}else if(k==='j'){e.preventDefault();press('parry',ts)}}
  if(G.st==='player'){const m={'1':'atk','2':'heavy','3':'skill','4':'guard','5':'band'}[k];if(m){const btn=document.querySelector(`[data-ba="${m}"]`);if(btn&&!btn.disabled)bact(m)}}
});
window.addEventListener('resize',()=>{if(G.on)sizeCv()});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',readCols);

/* ===================== 개발자 창 ===================== */
function devInit(){
  try{FAST=localStorage.getItem('k2fast')==='1'}catch(e){}
  $('#devb').hidden=false;$('#bdev').classList.add('on');
}
function devOpen(){
  const s=S;const b=(c,l,a)=>`<button class="btn" data-dv="${c}"${a!=null?` data-a="${a}"`:''}>${l}</button>`;
  $('#dov').innerHTML=`<div class="pcard dev"><h2>개발</h2>
  <div class="seg">${b('fast','즉시 완료: '+(FAST||TEST?'켬':'끔'))}${s?b('finish','진행 중인 일 끝내기'):''}</div>
  ${s?`<h3>진행</h3><div class="seg">${b('night','밤 0',0)}${b('night','밤 1',1)}${b('night','밤 2',2)}${b('night','밤 3',3)}</div>
  <div class="seg">${b('heal','체력 가득')}${b('coin','동전 +50')}${b('band','붕대 +5')}${b('tut','가르침 처음부터')}${b('comp','다음 동료 합류 ('+s.comps.length+')')}${b('aff','데려간 동료 호감 +20')}${b('base','본거지 얻기')}${b('pit','피트 얻기')}${b('scrap','고철 +10')}${b('fixall','저택 모두 고치기')}${b('enc','길 위 마주침: '+(ENC_ON?'켬':'끔'))}${b('act1','1막 끝으로 (에다 직전)')}${b('pqgo','피트 실종 일으키기')}${b('outs','변두리 열기')}${b('kq','키리엔 퀘스트 다음 단계 ('+(s.kq||0)+')')}</div>
  <h3>전투</h3><div class="seg">${b('fight','골목개','dog')}${b('fight','도둑','thief')}${b('fight','점등꾼','lamp')}${b('fight','점등꾼 격노 직전','lamp2')}${b('fight','정화자','warden')}${b('fight','노래하는 옛 주인','singer')}${b('fight','쥐 떼','rats')}${b('fight','태엽 경비','clock')}${b('fight','유리관에서 나온 것','glass')}${b('fight','회색 수거인','collector')}${b('fight','그림자','shade')}${b('fight','덩어리','lump')}${b('fight','변이한 들개','mutt')}${b('fight','텅 빈 자','hollow')}${b('fight','재 짜는 사람','ashman')}</div>
  <h3>이야기</h3><div class="seg">${b('pro','시작 연출 다시')}${b('leg','1편 기억: '+(s.legacy?(s.legacy.end||'없음'):'없음'))}${b('state','상태 보기')}</div>
  <textarea id="dvs" readonly style="display:none"></textarea>`:'<p class="m">캐릭터를 만들면 진행 도구가 나온다.</p>'}
  <div class="btns">${'<button class="btn pri" data-dv="close">닫기</button>'}</div><p class="m" style="text-align:center">${VER} · 이 창은 게임 주인과 내 컴퓨터에서만 보인다</p></div>`;
  $('#dov').classList.add('on');
}
const DV={
  fast:()=>{FAST=!FAST;try{localStorage.setItem('k2fast',FAST?'1':'0')}catch(e){}},
  finish:()=>{if(S.act)S.act.t0=Date.now()-S.act.d*1000-1;S.disp.forEach(d=>d.t0=Date.now()-d.d*1000-1);Object.values(S.kids||{}).forEach(K=>{if(K.until)K.until=0});save()},
  night:a=>{S.night=+a;log('[개발] 밤 '+a);save()},
  heal:()=>{S.hp=S.mhp;save()},coin:()=>{S.coin+=50;save()},band:()=>{add('band',5);save()},
  tut:()=>{S.tutd=0;S.tutAsk=0;save()},scrap:()=>{add('scrap',10);save()},fixall:()=>{FIXN.forEach(k=>S.fix[k]=1);log('[개발] 저택을 모두 고쳤다');save()},enc:()=>{ENC_ON=!ENC_ON},
  pqgo:()=>{if(!S.pit){S.pit=1;S.kids=S.kids||{};S.kids.pit={st:'ok'}}S.kids.pit.st='lost';S.pq=1;S.eda=S.eda||1;log('[개발] 피트 실종');save()},outs:()=>{S.outs=1;save()},
  act1:()=>{S.night=Math.max(S.night,3);S.tutd=1;['kirien','oswin'].forEach(joinComp);if(!S.base){S.base=1;S.manor=1;S.vis.base=1}S.pit=1;log('[개발] 1막 끝 직전');save()},
  kq:()=>{if(!S.acad){S.eda=1;S.acad=1}if(!S.comps.includes('kirien'))joinComp('kirien');S.party='kirien';if((S.kq||0)<3)S.kq=(S.kq||0)+1;log('[개발] 키리엔 퀘스트 '+S.kq);save()},
  comp:()=>{const nx=Object.keys(COMP).find(k=>!S.comps.includes(k));if(nx){joinComp(nx);if(nx==='kirien'&&S.night<3)S.night=3}},
  base:()=>{devClose();grantBase();render();return 1},pit:()=>{devClose();grantPit();render();return 1},aff:()=>{if(S.party)aff(S.party,20);save()},
  fight:a=>{devClose();if(a==='lamp2'){startBattle('fight','lamp');G.fhp=Math.ceil(FOES.lamp.hp/2)+5;bbars()}else startBattle('fight',a);return 1},
  pro:()=>{devClose();prologue();return 1},
  leg:()=>{const order=['k','r','w',''];const cur=S.legacy?S.legacy.end:'';const nx=order[(order.indexOf(cur)+1)%order.length];
    S.legacy=nx?{name:'시험용 여행자',race:'p',og:'칼라쉬',tr:'남색 서리비늘',end:nx,pa:'fox'}:null;if(S.legacy&&S.base)S.inv.relic=1;save()},
  state:()=>{const t=$('#dvs');t.style.display='';t.value=S.comps.map(id=>`${cn(id)} 호감 ${S.aff[id]||0} · ${affTier(id)}단계 ${affName(id)}`).join('\n')+'\n\n'+JSON.stringify(S,null,1);return 1},
  close:()=>{devClose();return 1}
};
function devClose(){$('#dov').classList.remove('on');$('#dov').innerHTML=''}
$('#devb').addEventListener('click',e=>{e.currentTarget.blur();if(DEV)devOpen()});
$('#dov').addEventListener('click',e=>{const b=e.target.closest('[data-dv]');if(!b||!DEV)return;const keep=DV[b.dataset.dv](b.dataset.a);if(!keep){render();devOpen()}});
$('#bt').addEventListener('click',e=>{const b=e.target.closest('[data-bdev]');if(!b||!DEV||!G.on||G.kind!=='fight')return;b.blur();
  if(G.st==='end')return;if(b.dataset.bdev==='win')G.fhp=0;else G.hp=0;G.beats=[];bbars();checkEnd()});

window.__k2={KIDS,DSP,QA,CSK,cst,affName,TALK,CH,chNext,KQ,FIX,DECO,BOOK,comfort,comfortT,travelSec,roadFoe,get ENC_ON(){return ENC_ON},set ENC_ON(v){ENC_ON=v},SKL,OSK,gainXp,useSkill,get MW(){return MW},COMP,affTier,romOK,romReady,SCENE,EXP,joinComp,grantBase,grantPit,get DEV(){return DEV},get S(){return S},get PV(){return PV},ORIGIN,set S(v){S=v},get G(){return G},get C(){return C},CFG,FOES,TS,MV,press,bact,startBattle,endBattle,render,save,load,tick,scode,sdecode,legacyDecode,BW,TEST};
applyTheme();load();if(DEV)devInit();render();if(S&&S.pro!==99)prologue();setInterval(tick,500);caps();
